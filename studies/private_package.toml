[project]
name = "eeg-pipeline-studies"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["eeg-pipeline"]

[project.entry-points."eeg_pipeline.cli_commands"]
coupling = "studies.pain_study.cli.command_registry:coupling_command"
line-comb = "studies.pain_study.cli.command_registry:line_comb_command"
gradient = "studies.pain_study.cli.command_registry:gradient_command"
cardiac-gaps = "studies.pain_study.cli.command_registry:cardiac_gaps_command"
data-chain = "studies.pain_study.cli.command_registry:data_chain_command"
signature-prediction = "studies.pain_study.cli.command_registry:signature_prediction_command"
source-interpretation = "studies.pain_study.cli.command_registry:source_interpretation_command"

[tool.setuptools.packages.find]
where = [".."]
include = ["studies*"]
namespaces = true

[tool.setuptools.package-data]
"studies.pain_study" = ["scripts/config/*.yaml"]
"studies.pain_study.scripts" = ["README.md"]
"studies.pain_study.scripts.line_comb" = ["config.yaml", "README.md"]
"studies.pain_study.scripts.gradient" = ["config.yaml", "README.md"]
"studies.pain_study.scripts.cardiac_gaps" = ["config.yaml", "README.md"]
"studies.pain_study.scripts.conversion" = ["README.md"]
"studies.pain_study.scripts.t1" = ["README.md"]
"studies.pain_study.scripts.study_support" = ["README.md", "*.sh"]
"studies.pain_study.analysis" = ["README.md"]
"studies.pain_study.analysis.line_comb" = ["README.md"]
"studies.pain_study.analysis.bcg" = ["README.md"]
"studies.pain_study.study1" = ["config/*.yaml", "README.md"]
"studies.pain_study.study2" = ["config/*.yaml", "README.md"]
"studies.pain_study.eeg_coupling" = [
    "analysis/*.R",
    "config/*.yaml",
    "config/**/*.json",
    "config/**/*.label",
    "README.md",
]
