version: 3

acquisition:
  sampling_frequency_hz: 5000.0
  repetition_time_seconds: 0.9
  expected_channel_count: 64
  ecg_channel: ECG
  volume_annotation: Volume/V  1
  maximum_marker_deviation_samples: 1

gradient:
  moving_average_volumes: 21
  alignment_upsampling: 4
  maximum_alignment_shift_samples: 2.0
  # Disabled: the fixed study-data audit found no scanner-line improvement and
  # measurable non-harmonic signal distortion for 1-4 components.
  residual_obs_components: 0
  residual_obs_folds: 5
  residual_obs_seed: 42

resampling:
  low_pass_frequency_hz: 100.0
  output_sampling_frequency_hz: 1000.0

cardiac:
  obs_components: 4
  detection:
    sampling_frequency_hz: 250.0
    low_frequency_hz: 0.5
    high_frequency_hz: 30.0
    window_stride_samples: 50
    probability_threshold: 0.05
    minimum_support_samples: 5
    refractory_period_seconds: 0.4
    edge_margin_seconds: 0.1
  minimum_heart_rate_bpm: 40.0
  maximum_heart_rate_bpm: 160.0
  minimum_qrs_count: 10
  minimum_temporal_coverage: 0.9
  minimum_warning_rr_seconds: 0.375
  maximum_warning_rr_seconds: 1.5

qc:
  bootstrap:
    iterations: 10000
    confidence_level: 0.95
    seed: 42
  channels:
    - Fp1
    - F3
    - C3
    - O1
    - Fz
    - Cz
    - Pz
    - Oz
    - POz
    - FC3
    - PO3
    - PO7
  welch_duration_seconds: 16.384
  minimum_duration_seconds: 4.096
