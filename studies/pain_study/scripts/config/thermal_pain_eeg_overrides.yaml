# Thermal pain paradigm override template for eeg_pipeline/utils/config/eeg_config.yaml
# Apply these values via TUI Global Setup overrides or by copying into your project config.

project:
  task: "thermalactive"

alignment:
  fmri_onset_reference: "first_iti_start"

event_columns:
  predictor: ["stimulus_temp", "stimulus_temperature", "temp", "temperature"]
  rating: ["vas_final_coded_rating", "vas_final_rating", "vas_rating", "pain_intensity", "pain_rating", "rating"]
  binary_outcome: ["binary_outcome_coded", "binary_outcome", "pain", "outcome_binary", "label"]

preprocessing:
  condition_preferred_prefixes: ["Trig_therm", "Trig_"]

report:
  acquisition:
    # This acquisition's own bookkeeping, on top of what the pipeline writes for itself.
    # Trials are the Trig_* markers named above, so excluding these leaves the event rug
    # under the "Data quality over time" trace counting thermal trials and nothing else.
    #
    # "R  " and "R/" are Analyzer's heartbeat markers under two spellings, and "VOLUME/"
    # is the scanner volume marker — all three are also covered by the configured marker
    # descriptions, and are named here so a run whose markers were never sanitised is
    # still handled. "RESPONSE/" is the button press, which is not the event this
    # paradigm locks to; a paradigm that locks to the response must not carry this entry.
    non_event_prefixes:
      - "BAD"
      - "EDGE"
      - "NEW SEGMENT"
      - "VOLUME/"
      - "R  "
      - "R/"
      - "RESPONSE/"

  analysis:
    # The residual gradient comb, withheld from the aperiodic fit. The report used to
    # derive these windows from each run's volume markers; they are named here now that
    # core does not read a volume rate. Each one is a k/TR harmonic widened by 1.5 bins
    # either side of the tooth, on the 0.25 Hz Welch grid the sensor spectra are fitted
    # on. Copied from the derivation's own output rather than recomputed by hand, so the
    # windows are the windows it produced. One list covers the cohort: all 90 runs share
    # a 500 Hz sampling rate, a 100 Hz low-pass, and a volume rate identical to the bit.
    #
    # The fundamental behind these numbers is 1.1111185 Hz, not 1/0.9 = 1.1111111. The
    # scanner's TR is exactly 0.9 s -- the source markers sit every 900 samples at 1000 Hz
    # with no jitter -- but the derivation took the median marker interval from the
    # filtered recording, whose annotation onsets carry microsecond-scale noise. The two
    # differ by at most 0.0007 Hz at the top harmonic, a thousandth of a window width, and
    # withhold the same bins everywhere in the 2-45 Hz fit range.
    aperiodic_exclude_hz:
      - [0.7361, 1.4861]
      - [1.8472, 2.5972]
      - [2.9584, 3.7084]
      - [4.0695, 4.8195]
