# Line-comb diagnosis and removal, for THIS scanner room.
#
# What is being removed is characterised in docs/scanner_harmonic_diagnosis.md: a comb at
# multiples of about 1.2 Hz that is mains-synchronous, independent of the imaging
# gradients, and present before the scanner starts, plus independently moving narrow
# electrical lines. Every recording and adaptive window gets its own measured targets;
# the value below is only where the comb search starts. It describes one room and means
# nothing for another site.
#
# This is not a stage of MNE-BIDS-Pipeline. Its notch is FIR, and fifty narrow FIR notches
# would take the surrounding band with them. The removal runs before the pipeline reads
# the data and writes its own BIDS root.

paths:
  # null inherits the core eeg_config.yaml paths.* value. Set one only to point this
  # workflow somewhere the rest of the pipeline does not look.
  #
  # bids_root is pinned rather than inherited: the core config points at the *cleaned*
  # copy, because that is what every downstream stage consumes. This workflow is what
  # produces that copy, so it has to read the uncleaned root. Left inheriting, it would
  # read its own output and write bids_output/eeg_linecleaned_linecleaned.
  # Repo-relative, matching diagnosis_dir and removal_dir below; run from the repo root.
  bids_root: "data/bids_output/bids_analyzer_archive/eeg"
  source_data: null
  deriv_root: null

  # Cleaned copy written by `eeg-pipeline line-comb apply`. Point paths.bids_root in the
  # core config at this directory to make the rest of the pipeline read the cleaned data.
  output_root: "<bids_root>_linecleaned"

  # Written by `eeg-pipeline line-comb notch`, which reads output_root above. That stage is
  # optional and runs last; point paths.bids_root here instead if the notch is in use.
  notched_root: "<bids_root>_linecleaned_notched"

  # Final cleaned epochs, which decide which lines reach the analyses.
  preprocessed_eeg: "<deriv_root>/preprocessed/eeg"

  # Tables and figures. Repo-relative, and cited by name in docs/scanner_harmonic_*.md.
  diagnosis_dir: "outputs/scanner_harmonic_diagnosis"
  removal_dir: "outputs/line_comb_removal"

dataset:
  # BIDS task label to process. Recordings are found at sub-*/[ses-*/]eeg/ with or without
  # a run- entity, so a single continuous acquisition per participant -- a resting or
  # baseline recording -- is a valid dataset. No events of any kind are required.
  task: "thermalactive"

line_comb_removal:
  # Length of each adaptive estimation window. 54 s here is 60 TRs of 0.9 s, chosen so the
  # window is commensurate with this site's volume repetition; elsewhere it is simply the
  # window length. It sets the frequency resolution the fit works at (18.5 mHz) and the
  # shortest recording that can be processed at all.
  estimation_window_s: 54.0

  # Band handed to a downstream wide notch instead of being taken here. Set [49.5, 50.5]
  # where mains is 50 Hz. Only consulted when exclude_mains is true.
  mains_notch_hz: [59.5, 60.5]

  # Optional ceiling on the share of 28-95 Hz a broadband signal may lose, checked by
  # `apply`. Null means the cost is measured and reported but nothing is refused on it.
  #
  # There is no default number here on purpose. The cost is already fixed by the evidence:
  # it is the notch width times the number of targets, the width ratio was set by the
  # documented sweep below to the narrowest value that still pushes every line under its
  # local background, and a target only exists once the replication rules admit it. Nothing
  # is left for a ceiling to constrain, so any number shipped here could only have been
  # chosen after seeing the answer -- which is what the retired 0.18 was, set because the
  # cohort had reached 0.170.
  #
  # A study that wants a stated budget declares it here. That is then its own scientific
  # decision, recorded in the derivative's provenance alongside what the cost actually was.
  max_band_cost: null

  nominal_fundamental_hz: 1.2      # search seed only; each run is measured
  harmonic_range: [24, 79]         # harmonics used to FIT the fundamental (well-determined ones)

  # Harmonics actually removed. Reaches lower than the fit: the diagnosis found comb
  # membership at harmonics 22 and 23 (26.40 and 27.60 Hz), each within 5 mHz of its comb
  # position, which is far too precise to be coincidence. Harmonic 11 (13.23 Hz) is left
  # alone -- 30 mHz off, in 2 of 15 participants, and sitting where alpha meets beta.
  # Reaches past harmonic 79 (94.8 Hz) as well. Harmonics 80-82 sit at 96.0, 97.2 and
  # 98.4 Hz, inside the 100 Hz lowpass and so in the delivered data; 97.2 Hz is present in
  # 15 of 15 participants with no measurable frequency scatter. They are outside the bands
  # this study analyses, so this end of the range is hygiene rather than a result.
  #
  # Extended to 83 (99.6 Hz) on 2026-08-02: an audit of the delivered epochs found 99.6 Hz
  # standing 3.8 dB over background in 12 of 15 participants on ~39 channels, the most
  # consistent residual line in the cohort. It is a comb member -- 1.2 x 83 to within the
  # 0.08 Hz of frequency scatter it shows across subjects -- that simply sat past the old
  # ceiling. Checked against a background extrapolated from below the 100 Hz low-pass knee
  # (+3.9 to +13.2 dB per subject) so it is a line rather than a filter-edge artifact.
  removal_harmonic_range: [22, 83]

  # Isolated lines are detected automatically. No historical frequency list is accepted:
  # the 94 Hz source alone spans 0.595 Hz between participants, so a static seed either
  # misses artifacts or needs a window broad enough to threaten signal.
  #
  # Rechecked on 2026-08-03 across all fifteen run-1 recordings after sub-0000's scanner-
  # restart crop: the exact detector below with its cap disabled returned 2-6 candidates
  # at 10 dB (mean 3.67), against 3-10 at 6 dB (mean 6.07). The 10 dB floor is retained
  # as the conservative setting; the replication rules below supply independent evidence.
  #
  # What keeps it from removing signal: peaks inside the comb model's 0.06 Hz membership
  # tolerance are left to the comb pass, and peaks wider than 0.25 Hz measured 3 dB down
  # are left alone because a scanner line is a sinusoid while alpha and beta rhythms are
  # whole hertz wide. Detection is deliberately not blind at benchmark-probe frequencies;
  # if a real artifact collides with a probe, the benchmark fails and the probe must move.
  detection_min_prominence_db: 10.0
  # A candidate may be weaker than 10 dB in an individual run only when the same narrow
  # summit recurs in at least three runs and one independent run clears 10 dB. This joint
  # rule recovers stable machine lines such as 58.426 Hz without treating 6 dB as a
  # sufficient single-run detection threshold.
  detection_candidate_prominence_db: 6.0
  # A block scan makes many more comparisons than a whole-run scan. Replication alone is
  # insufficient: ordinary 54 s spectra produced recurrent 10-13 dB narrow local maxima
  # around 39-45 Hz. The measured non-stationary 27.519 Hz machine line is 16.71 dB on a
  # run-balanced basis and is the only block-only sub-0011 cluster above this floor.
  detection_block_min_prominence_db: 15.0
  detection_low_hz: 20.0           # below this the spec finds no removable lines at all
  detection_high_hz: 100.0
  # Session-wide targets require this many runs. The runs are replication already in hand
  # -- one machine, minutes apart -- and they separate a persistent source from a one-run
  # fluctuation. A separate path below handles a real source confined to one recording.
  min_runs_per_line: 3
  # Whole-run spectra dilute intermittent machine lines. A second path may authorize one
  # session-wide when it appears in at least two runs. A line confined to one recording is
  # instead removed only from the exact adaptive windows that detected it, after it clears
  # the 15 dB strong-line threshold and recurs in at least three non-overlapping 54 s
  # windows. Adjacent 50%-overlap windows do not count as independent evidence.
  min_runs_per_block_line: 2
  min_independent_windows_per_line: 3

  # Exact-epoch scoping used to live here (study_event_name, study_epoch_s,
  # expected_study_events_per_run) and is gone. The transform is continuous everywhere, so
  # the epochs stopped being a transform scope; as evidence they were measured to be
  # strictly weaker than the windows that already cover the same samples -- a 20 s epoch
  # spectrum resolves 50 mHz against the 54 s window's 18.5 mHz, and 37 mHz is the
  # separation this code uses to call two peaks distinct sources, so an epoch cannot
  # resolve anything a window cannot. On sub-0008 the epochs authorised no distinct source:
  # every difference they made was a position shift of 2-26 mHz, all inside the notch that
  # gets applied anyway, plus one duplicate target per run. Their four gate criteria held
  # back 2 recordings of 90, all via study_no_focal_residual.
  #
  # Removing them is also what lets this workflow run on a recording with no events at all,
  # such as a resting or baseline acquisition.

  # Refinement window for a detected nominal. It sits on the summit already, so it needs
  # only enough room to refine sub-bin -- and it must stay narrow, because estimate_comb
  # refuses a nominal within its search window of a comb position, on the grounds that a
  # search that wide refines onto the harmonic instead. At 0.15 Hz it does: sub-0001's
  # 93.759 Hz line is 0.137 Hz from harmonic 78, so the detector offered it and the
  # estimator raised, stopping the benchmark. Kept below the detector's own floor of one
  # line width (0.109 Hz) so a line detection admits can never be one the estimator
  # refuses.
  detection_search_hz: 0.05
  search_hz: 0.25                  # comb search half-width, below half the 1.2 Hz spacing
  min_prominence_db: 1.0           # a line weaker than this joins neither the fit nor the targets
  filter_length: "27s"             # Half the 54 s block; resolves the sub-0011 harmonic shoulder
  filter_jobs: 4                    # Shared-memory threads; avoids process copies and semaphores
  mt_bandwidth: 0.6                # +/-0.3 Hz, half the distance to the neighbouring line

  # How much spectrum each line costs. spectrum_fit subtracts a sinusoid at every bin
  # inside this window, so it, not mt_bandwidth, sets the size of the hole. The width is
  # freq/ratio because a mains-locked comb wanders in proportion to harmonic number.
  # MNE's own default is freq/200, which would empty a quarter of 28-95 Hz; freq/450 is
  # the narrowest setting measured to push every line below background, at 12% of the
  # band. Raising the ratio further leaves the high harmonics standing.
  notch_width_ratio: 450
  notch_width_min_hz: 0.05         # wider than one bin at the 27 s working resolution
  # Propagate each adaptive window's f0 uncertainty to harmonic k as k * SE(f0).
  #
  # Validated harmonics retain their measured peak positions; unsupported harmonics are
  # extrapolated from the independently fitted arithmetic grid. The uncertainty term is
  # therefore still required for estimated f0 error, while physical within-run wander is
  # separately covered by the empirically calibrated freq/450 base width.
  #
  # Across the earlier 90 continuous plans, empirical base widths touched at most 13.591%
  # of 28-95 Hz and the two-standard-error expansion reached 17.017%. Base cost is now
  # descriptive rather than separately capped: the sole 18% opportunity-cost gate measures
  # the maximum actual continuous or exact channel-level transform, including data-local
  # residual targets. Two standard errors cover per-window estimation error; a remaining
  # line is resolved by matched same-scope controls, not by post-hoc global widening.
  uncertainty_confidence_z: 2.0
  low_hz: 3.0
  # Raised from 99.0 on 2026-08-02 so harmonic 83 (99.6 Hz) is reachable. Still under the
  # 100 Hz lowpass the pipeline applies, and the removal notch there is freq/450 = 0.22 Hz
  # wide, so it stays clear of the cutoff.
  high_hz: 99.8

  # Mains is left to MNE-BIDS-Pipeline's FIR notch, not taken here.
  #
  # The same is true of 57 Hz, for the same reason, but that one is taken by
  # `line-comb notch` rather than downstream -- see notch_bands at the bottom of this file.
  #
  # Taking it here was tried and measured. The comb is mains-synchronous, so 60 Hz is comb
  # harmonic 50 and turning this flag off makes it a target -- but the comb fit forces
  # harmonics onto an exact grid n*f0, and the physical mains line does not sit on it: the
  # grid put harmonic 50 at 59.9994 Hz while the line stood at 60.0344 Hz, and across the
  # cohort the peak scattered 59.906-60.083 Hz. The result was a 0.41 Hz hole dug at the
  # grid position with the line still standing at +15.38 dB beside it.
  #
  # Aiming at the observed peak instead does not fix it, because 60 Hz is a cluster rather
  # than a line: 59-61 Hz carries 32-38 distinct peaks above 3 dB at 0.002 Hz resolution.
  # spectrum_fit at the grid and at the measured peak both landed on +7.1 dB, the peak
  # merely moving to a neighbour. Only a notch wide enough to span the cluster clears it.
  #
  # preprocessing.notch_freq MUST be 60 while this is true, or 60 Hz survives.
  # tests/scripts/line_comb/test_config_pairing.py fails if the two ever disagree.
  exclude_mains: true

# Bands taken by `eeg-pipeline line-comb notch`, the optional last stage. Read as edges,
# because edges are what a spectrum shows and what a diagnosis measures.
#
# The removal above reads this list too, and excludes every band in it -- the same division
# of labour `exclude_mains` makes with the downstream FIR notch. It is not an optimisation.
# Subtracting sinusoids inside a cluster promotes the neighbouring peak, the survivor fails
# the residual criterion, `apply` refuses, and `notch` reads what `apply` wrote -- so the
# two stages deadlock. Measured on sub-0008 before the exclusion: 5 of 6 recordings failed
# at p=0.0244, the floor with 40 controls, each with its worst residual in 57.15-57.4 Hz.
# tests/scripts/line_comb/test_notch_band_exclusion.py fails if the coupling is broken.
#
# Use this only for contamination that is a *cluster*, where subtracting sinusoids cannot
# work. A resolvable line belongs in the removal above, which costs a few hundredths of a
# hertz; a band here costs its whole width whether or not signal was in it.
#
# 56.8-57.7 Hz qualifies on measurement, not assumption. At 2 mHz resolution it carries
# 75-118 distinct peaks above 3 dB (sub-0008, sub-0011, 2026-08-07), non-stationary between
# 54 s windows -- about six times the peak density of mains, which this pipeline already
# concedes to a wide notch. Across 18 recordings it holds a median 10.9% of all 28-95 Hz
# power, up to 24.7%, in 1.34% of the band's width, and 92.6% of that stands above the
# shoulders either side, so it is artifact rather than spectrum. The burden varies ten-fold
# between participants (sub-0008 20-25%, sub-0000 2-3%), which is the systematic
# between-participant offset the line comb exists to remove.
#
# What it costs: 0.9 Hz is 1.8% of gamma [30.1, 80.0]. The transitions make the real
# footprint wider than the span requested; notch_manifest.tsv reports the measured change
# in every analysed band rather than the requested width, for exactly that reason.
#
# The 90-run benchmark that motivated this: 24 of its 26 failures had their worst residual
# in 57.1-57.4 Hz, and pass rate tracked the 57 Hz burden by participant.
notch_bands:
  - [56.8, 57.7]
