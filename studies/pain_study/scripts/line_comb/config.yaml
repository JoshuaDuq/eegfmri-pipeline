# Line-comb diagnosis and removal, for THIS scanner room.
#
# What is being removed is characterised in docs/scanner_harmonic_diagnosis.md: a comb at
# multiples of about 1.2 Hz that is mains-synchronous, independent of the imaging
# gradients, and present before the scanner starts, plus four lines that drift on their
# own. Every run gets its own frequency estimate; the values below are only where the
# search starts. They describe one room and mean nothing for another site.
#
# This is not a stage of MNE-BIDS-Pipeline. Its notch is FIR, and fifty narrow FIR notches
# would take the surrounding band with them. The removal runs before the pipeline reads
# the data and writes its own BIDS root.

paths:
  # null inherits the core eeg_config.yaml paths.* value. Set one only to point this
  # workflow somewhere the rest of the pipeline does not look.
  #
  # bids_root is pinned rather than inherited: the core config points at the *cleaned*
  # copy, because that is what every downstream stage consumes. This workflow is what
  # produces that copy, so it has to read the uncleaned root. Left inheriting, it would
  # read its own output and write bids_output/eeg_linecleaned_linecleaned.
  # Repo-relative, matching diagnosis_dir and removal_dir below; run from the repo root.
  bids_root: "data/bids_output/eeg"
  source_data: null
  deriv_root: null

  # Cleaned copy written by `eeg-pipeline line-comb apply`. Point paths.bids_root in the
  # core config at this directory to make the rest of the pipeline read the cleaned data.
  output_root: "<bids_root>_linecleaned"

  # Final cleaned epochs, which decide which lines reach the analyses.
  preprocessed_eeg: "<deriv_root>/preprocessed/eeg"

  # Tables and figures. Repo-relative, and cited by name in docs/scanner_harmonic_*.md.
  diagnosis_dir: "outputs/scanner_harmonic_diagnosis"
  removal_dir: "outputs/line_comb_removal"

line_comb_removal:
  nominal_fundamental_hz: 1.2      # search seed only; each run is measured
  harmonic_range: [24, 79]         # harmonics used to FIT the fundamental (well-determined ones)

  # Harmonics actually removed. Reaches lower than the fit: the diagnosis found comb
  # membership at harmonics 22 and 23 (26.40 and 27.60 Hz), each within 5 mHz of its comb
  # position, which is far too precise to be coincidence. Harmonic 11 (13.23 Hz) is left
  # alone -- 30 mHz off, in 2 of 15 participants, and sitting where alpha meets beta.
  # Reaches past harmonic 79 (94.8 Hz) as well. Harmonics 80-82 sit at 96.0, 97.2 and
  # 98.4 Hz, inside the 100 Hz lowpass and so in the delivered data; 97.2 Hz is present in
  # 15 of 15 participants with no measurable frequency scatter. They are outside the bands
  # this study analyses, so this end of the range is hygiene rather than a result.
  #
  # Extended to 83 (99.6 Hz) on 2026-08-02: an audit of the delivered epochs found 99.6 Hz
  # standing 3.8 dB over background in 12 of 15 participants on ~39 channels, the most
  # consistent residual line in the cohort. It is a comb member -- 1.2 x 83 to within the
  # 0.08 Hz of frequency scatter it shows across subjects -- that simply sat past the old
  # ceiling. Checked against a background extrapolated from below the 100 Hz low-pass knee
  # (+3.9 to +13.2 dB per subject) so it is a line rather than a filter-edge artifact.
  removal_harmonic_range: [22, 83]

  # Not on the comb, and they drift. 57.3485 and 58.3442 were added on 2026-07-31 after
  # sub-0012's cleaned data showed them standing 9.8 and 10.0 dB above background, the two
  # largest narrowband residuals left in the analysis band; both are 0.05-0.07 Hz wide,
  # which is the spectral resolution, so neither is a rhythm. Cohort presence measured on
  # pre-removal data: 57.3485 in 12 of 15 participants, 58.3442 in 7 of 15.
  #
  # 57.2247 and 57.3485 are 0.124 Hz apart, closer than isolated_search_hz, so their search
  # windows overlap and the stronger of the two (about 17 dB stronger here) was being handed
  # to both. Narrowing the window cannot fix it: 57.2247 wanders up to 147 mHz across the
  # cohort and needs a wide one to be followed. estimate_comb instead resolves these
  # strongest first and lets each line be claimed once.
  # 82.2228 is NOT a room-comb member and does not drift with mains: it is the imaging
  # gradient's 74th harmonic, 74/TR at TR = 0.899994 s, and it is here because the audit
  # found it 3.0 dB over background in 9 of 15 participants inside the 62-95 Hz gamma
  # window. Everything else in this list wanders with the room; this one is locked to the
  # scanner clock and has the tightest scatter of any line measured (0.12 Hz). Re-derive it
  # if the sequence TR ever changes -- it is the one entry here that is not a property of
  # the room.
  #
  # Added 2026-08-02 from an audit of the delivered epochs (14 participants, sub-0008
  # excluded). 23.7776 and 29.6854 are narrow, on neither comb, and present in 7 and 9 of
  # 14; 29.6854 matters because it sits 0.41 Hz below the 30.1 Hz gamma_low edge, close
  # enough that any spectral smoothing pulls it in. 81.1111 is the imaging gradient's 73rd
  # harmonic at TR = 0.9 s -- the partner of 82.2228 above, with the same nulled centre and
  # elevated shoulders, and like it must be re-derived if the sequence TR ever changes.
  #
  # The audit's 61.0353 Hz was tried here and removed again: it falls 0.128 Hz from comb
  # harmonic 51 at 61.1629 Hz, inside isolated_search_hz, so estimate_comb rejects it --
  # the search would find the comb. It may simply be harmonic 51 rather than the mains
  # sideband the audit took it for. Either way it sits in the unanalysed 58-62 gap, the
  # comb already covers that position, and nothing is lost by leaving it out.
  #
  # 93.76 Hz is deliberately absent: 16.6 dB, but in one participant only, and a cohort
  # notch for one participant is the wrong trade. 59.02 Hz is absent too -- 4 of 14, and
  # inside the 60 Hz notch skirt.
  #
  # Mains is deliberately NOT here. This comb is mains-synchronous -- its fundamental is
  # mains/50 -- so 60 Hz is comb harmonic 50, already inside removal_harmonic_range below.
  # Listing it as an isolated line is both redundant and rejected: estimate_comb refuses a
  # seed within isolated_search_hz of a comb position, because the search would just find
  # the comb. See exclude_mains below.
  isolated_hz: [23.7776, 29.6854, 47.0362, 57.2247, 57.3485, 58.1807, 58.3442, 81.1111, 82.2228, 94.0748]
  search_hz: 0.25                  # comb search half-width, below half the 1.2 Hz spacing
  isolated_search_hz: 0.15         # narrower: 47.036 Hz sits 0.24 Hz from comb harmonic 39
  min_prominence_db: 1.0           # a line weaker than this joins neither the fit nor the targets
  filter_length: "20s"             # 4 s windows cannot resolve a 1.2 Hz spacing and fail the gate
  mt_bandwidth: 0.6                # +/-0.3 Hz, half the distance to the neighbouring line

  # How much spectrum each line costs. spectrum_fit subtracts a sinusoid at every bin
  # inside this window, so it, not mt_bandwidth, sets the size of the hole. The width is
  # freq/ratio because a mains-locked comb wanders in proportion to harmonic number.
  # MNE's own default is freq/200, which would empty a quarter of 28-95 Hz; freq/450 is
  # the narrowest setting measured to push every line below background, at 12% of the
  # band. Raising the ratio further leaves the high harmonics standing.
  notch_width_ratio: 450
  notch_width_min_hz: 0.05         # one bin at the 20 s working resolution
  low_hz: 3.0
  # Raised from 99.0 on 2026-08-02 so harmonic 83 (99.6 Hz) is reachable. Still under the
  # 100 Hz lowpass the pipeline applies, and the removal notch there is freq/450 = 0.22 Hz
  # wide, so it stays clear of the cutoff.
  high_hz: 99.8

  # Mains is left to MNE-BIDS-Pipeline's FIR notch, not taken here.
  #
  # Taking it here was tried and measured. The comb is mains-synchronous, so 60 Hz is comb
  # harmonic 50 and turning this flag off makes it a target -- but the comb fit forces
  # harmonics onto an exact grid n*f0, and the physical mains line does not sit on it: the
  # grid put harmonic 50 at 59.9994 Hz while the line stood at 60.0344 Hz, and across the
  # cohort the peak scattered 59.906-60.083 Hz. The result was a 0.41 Hz hole dug at the
  # grid position with the line still standing at +15.38 dB beside it.
  #
  # Aiming at the observed peak instead does not fix it, because 60 Hz is a cluster rather
  # than a line: 59-61 Hz carries 32-38 distinct peaks above 3 dB at 0.002 Hz resolution.
  # spectrum_fit at the grid and at the measured peak both landed on +7.1 dB, the peak
  # merely moving to a neighbour. Only a notch wide enough to span the cluster clears it.
  #
  # preprocessing.notch_freq MUST be 60 while this is true, or 60 Hz survives.
  # tests/scripts/line_comb/test_config_pairing.py fails if the two ever disagree.
  exclude_mains: true
