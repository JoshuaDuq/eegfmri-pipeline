study2:
  confirmatory:
    study1_cell:
      target: "NPS"
      model: "elasticnet"
      feature_family: "power"
      frequency_preset: "alpha_beta_gamma"
      feature_resolution: "individual_channel"
      residualization_level: 2
      contribution_bands:
        - "alpha"
        - "beta"
        - "gamma"
    study1_gates:
      max_holm_p: 0.05
      min_delta_r2: 0.02
      min_delta_r2_lower_ci: 0.005
      min_level2_delta_r2: 0.005
      min_target_split_half_reliability: 0.4
      min_target_reliability_n_trials: 30
      require_positive_within_subject_delta_r2: true
      require_temporal_negative_controls: true
      require_artifact_censoring_robustness: true
  contributions:
    subject_column: "subject_id"
    trial_column: "trial_id"
    combined_column: "eta_combined"
    combined_standardized_column: "eta_combined_z"
    alpha_column: "eta_alpha"
    beta_column: "eta_beta"
    gamma_column: "eta_gamma"
    alpha_standardized_column: "eta_alpha_z"
    beta_standardized_column: "eta_beta_z"
    gamma_standardized_column: "eta_gamma_z"
  source_stage:
    min_source_valid_subjects: 30
    min_feasibility_subjects: 20
    min_valid_blocks_per_subject: 3
    min_retained_trials_per_subject: 25
    min_residual_degrees_of_freedom: 15
    max_condition_number: 100
    max_opposite_band_vif: 5
    max_collinearity_failure_fraction: 0.20
    continuous_columns:
      - "onset"
      - "trial_index_within_block"
      - "hrf_weighted_framewise_displacement"
      - "hrf_weighted_std_dvars"
      - "hrf_weighted_fp1_fp2_high_frequency_power"
      - "residual_ecg_coupling"
    categorical_columns:
      - "block"
      - "stimulus_temp"
      - "selected_surface"
    fixed_categorical_levels:
      block:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
      stimulus_temp:
        - 44.3
        - 45.3
        - 46.3
        - 47.3
        - 48.3
        - 49.3
      selected_surface:
        - 1
        - 2
        - 3
        - 4
        - 5
  source_modeling:
    primary_power_estimand: "total_power"
    erp_subtracted_power: "sensitivity_only"
    primary_inverse_method: "sLORETA"
    rank_excluded_channels:
      - "Fp1"
      - "Fp2"
    noise_covariance_baseline_s:
      - -5.0
      - -0.01
    immediate_baseline_s:
      - -0.2
      - -0.01
    active_plateau_window_s:
      - 3.0
      - 10.5
    regularization:
      snr: 3.0
      lambda2: 0.1111111111111111
      loose_orientation: 0.2
      depth_weighting: 0.8
    sensitivity_snr:
      - 1.0
      - 5.0
    report_point_spread_fwhm: true
  source_model_qc:
    min_valid_eeg_channel_location_fraction: 0.90
    max_mean_coregistration_error_mm: 5.0
    max_coregistration_error_mm: 10.0
  artifact_controls:
    sensor_template_abs_r_threshold: 0.80
    source_artifact_map_abs_r_threshold: 0.50
    holm_alpha: 0.05
    gamma_requires_artifact_survival: true
  directional_consistency:
    min_true_target_spatial_r: 0.20
    min_cluster_same_sign_fraction: 0.60
  source_inference:
    primary_cluster_forming_p: 0.01
    sensitivity_cluster_forming_p:
      - 0.001
  permutations:
    target_retrained_valid_draws: 1000
    max_invalid_draw_fraction: 0.20
    compute_budget_hours: 72
  spatial_comparison:
    min_meaningful_eeg_fmri_abs_r: 0.15
    brainsmash_surrogates: 5000
    fmri_smoothing_kernel_source: "median_point_spread_fwhm"
  behavioral_convergence:
    min_rated_trials: 25
    min_permutation_valid_blocks: 3
    permutations: 5000
  reporting:
    bca_bootstrap_resamples: 10000
  robustness:
    framewise_displacement_mm: 0.5
    dvars_robust_z: 3.0
    fp1_fp2_artifact_robust_z: 3.0
    cardiac_phase_locking_percentile: 95
    scanner_residual_robust_z: 3.0
    min_unthresholded_spatial_r: 0.50
    min_cluster_dice: 0.40
    max_centroid_displacement_mm: 15.0
