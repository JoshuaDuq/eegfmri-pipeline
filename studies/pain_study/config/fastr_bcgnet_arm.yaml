# The in-scanner arm for subjects 0019/0020/0021, corrected with the Python FASTR +
# BCGNet chain.
#
# Same three participants and the same paradigm as the MRI-simulator arm
# (studies/pain_study/config/simulator_arm.yaml), recorded in the bore about a week
# earlier: 0019 on 2026-08-17, 0020 on 2026-08-19, 0021 on 2026-08-20. Input is
# source_data/fastr_python_v2_bcgnet/, where FASTR removed the gradient artifact,
# downsampled to 1 kHz and cropped each run to its volume bounds, and BCGNet removed the
# ballistocardiogram. Outputs are kept beside the simulator arm's so the two can be
# compared.
#
# This file matches simulator_arm.yaml on every leaf the recordings allow. It diverges
# only where they force it -- the marker names, and the report keys that name them --
# because a simulator/scanner contrast can only separate a scanner effect from a
# preprocessing effect if the preprocessing is the same. Diff the two files before
# trusting any cross-arm result.
#
# Run as:
#
#     bash studies/pain_study/scripts/run_simulator_arm.sh \
#         --config studies/pain_study/config/fastr_bcgnet_arm.yaml 0019 0020 0021

extends: "../../../eeg_pipeline/utils/config/eeg_config.yaml"

project:
  task: "thermalactive"
  paradigm: "task"

paths:
  # Absolute, because the loader only treats a value as a path when it contains a
  # separator, and because this config must not depend on the directory it is run from.
  bids_root: "/Volumes/KINGSTON/EEG_fMRI_data/mri_simulator/fastr_bcgnet/bids"
  deriv_root: "/Volumes/KINGSTON/EEG_fMRI_data/mri_simulator/fastr_bcgnet/derivatives"
  source_data: "/Volumes/KINGSTON/EEG_fMRI_data/source_data/fastr_python_v2_bcgnet"
  # fMRI was acquired alongside these recordings, and the volume markers survive in the
  # events. It stays null anyway: setting it turns on the epoching stage's fMRI alignment
  # and trimming, which the simulator arm cannot have, and that would be a difference in
  # the epochs rather than in the recordings. Set it, and re-run both arms, if the
  # comparison ever needs fMRI-aligned epochs.
  bids_fmri_root: null

preprocessing:
  # Identical to the simulator arm.
  condition_preferred_prefixes: ["Trig_therm"]
  # A volume marker every 0.9 s means no inter-event gap approaches the 15 s break
  # threshold, so this would find nothing here even if it were on.
  find_breaks: false
  # FASTR removed the gradient artifact and BCGNet the ballistocardiogram. Neither touches
  # mains, and no line-comb stage has run over this generation.
  notch_freq: 60

ica:
  # No human reviewed these components, on either arm. The exclusions are ICLabel's and
  # MNE's ECG/EOG detectors'.
  require_manual_review: false

  # Matched to the simulator arm. The packaged null resolves to 0.1, which the core config
  # prescribes where a ballistocardiogram is present -- and one was present here, before
  # BCGNet. 0.25 is set because a two-arm contrast cannot separate a scanner effect from a
  # threshold effect. Change it to null for this arm's usual in-scanner treatment, and then
  # do not compare component counts across the arms.
  ecg_threshold: 0.25

  cardiac_review:
    # Left at the inherited null, which is not the usual in-scanner setting. These
    # recordings carry no Analyzer "Pulse Artifact/R" train -- the BCGNet chain does not
    # write one -- so there is no marker to name, and beat_source "auto" falls through to
    # detection on the ECG lead.
    #
    # That fallback is what locks onto the magnetohydrodynamic deflection on the
    # Analyzer-era runs, so it was measured here before being accepted, on run 1 of each
    # subject: sub-0020 48.3 bpm and sub-0021 57.1 bpm, both with a tight RR spread, and
    # sub-0019 110.2 bpm with a bimodal RR (IQR 0.514-0.983 s), which is double-marking
    # rather than an MHD lock. Usable, but sub-0019's beat count is inflated -- read its
    # cardiac panel with that in mind, and note that promote_exclusions is on.
    marker_description: null

  band_specific_report:
    # Empty on both arms. These events do carry stimulus_temp, so the packaged comparison
    # would run, but it is an exploratory report panel that controls no derivative and the
    # simulator arm's is empty.
    comparisons: []

report:
  acquisition:
    # Report-only: which markers the event rug under the data-quality trace counts as
    # trials. This arm's spellings differ from the simulator arm's -- "Rating_on" where
    # that one has "Vas_on", plus the volume train and the two marks the FASTR chain writes
    # about its own output, and neither "Rec_start" nor "Simfx_start". No trailing slashes:
    # the config loader resolves any string containing a separator into a filesystem path,
    # and the comparison is startswith() on the upper-cased description.
    #
    # "COMMENT" catches "Comment/QC_ResidualHigh", the chain's per-run gradient-residual
    # flag. It is carried through conversion deliberately: neither results/sub-*.json nor
    # cohort_summary.csv records it, so the annotation is the only surviving per-run record
    # of which runs the chain was unhappy with.
    non_event_prefixes:
      - "BAD"
      - "COMMENT"
      - "EDGE"
      - "NEW SEGMENT"
      - "VOLUME"
      - "ITI_START"
      - "STIM_ON"
      - "PAINQ_ON"
      - "RATING_ON"
  analysis:
    # The gradient comb withheld from the report's aperiodic fit, copied verbatim from
    # studies/pain_study/config/inscanner_lorie_matched.yaml: each entry is a k/TR harmonic
    # widened by 1.5 bins either side on the 0.25 Hz Welch grid. It applies unchanged here
    # -- the volume markers in these runs are 0.900 s apart, the same TR the list was
    # derived for, and FASTR attenuates the harmonics without moving them. The simulator
    # arm's list is empty because those recordings have no comb; withholding this arm's
    # comb is the same treatment, not a different one.
    aperiodic_exclude_hz:
      - [0.7361, 1.4861]
      - [1.8472, 2.5972]
      - [2.9584, 3.7084]
