      model: "elasticnet"
      feature_spec: "alpha_beta_gamma"
      targets: ["NPS", "SIIPS1"]
    sensor_topographies:
      dimensions_mm:
        width: 183.0
        height: 86.0
      png_dpi: 600
      bands:
        - name: "alpha"
          label: "Alpha"
          frequency_hz: [8.0, 12.9]
        - name: "beta"
          label: "Beta"
          frequency_hz: [13.0, 30.0]
        - name: "gamma_low_clean"
