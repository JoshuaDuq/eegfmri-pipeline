study1:
  cohort:
    min_subjects: 2
  features:
    exploratory_feature_families:
      - "spectral"
      - "aperiodic"
      - "erds"
      - "ratios"
      - "asymmetry"
      - "complexity"
      - "bursts"
  targets:
    contrast_name: "pain_vs_nonpain"
    metric: "dot"
    method: "lss"
    normalization: "none"
    round_decimals: 3
    names: ["NPS", "SIIPS1"]
    input_source: "fmriprep"
    fmriprep_space: "MNI152NLin2009cAsym"
    require_fmriprep: true
    condition_a_column: "pain_binary_coded"
    condition_a_value: "1"
    condition_b_column: "pain_binary_coded"
    condition_b_value: "0"
    condition_scope_trial_type_column: "trial_type"
    condition_scope_trial_types: ["stimulation"]
    condition_scope_phase_column: "stim_phase"
    condition_scope_stim_phases: ["plateau"]
    hrf_model: "spm"
    drift_model: "cosine"
    high_pass_hz: 0.008
    low_pass_hz: null
    smoothing_fwhm: null
    confounds_strategy: "auto"
    lss_other_regressors: "all"
  feature_benchmark:
    n_perm: 0
    inner_splits: 5
    outer_jobs: 1
    feature_harmonization: "intersection"
  deep_regression:
    n_epochs: 25
    batch_size: 32
    learning_rate: 0.001
    weight_decay: 0.0001
    validation_fraction: 0.2
    patience: 5
    temporal_kernel_size: 15
    temporal_filters: 8
    dropout: 0.25
    use_cuda: false
    presets:
      alpha: ["alpha"]
      beta: ["beta"]
      gamma: ["gamma"]
      alpha_beta_gamma: ["alpha", "beta", "gamma"]
  outputs:
    root_name: "study1"
