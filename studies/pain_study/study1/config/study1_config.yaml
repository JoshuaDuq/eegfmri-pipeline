study1:
  cohort:
    min_subjects: 30
  features:
    exploratory_feature_families: []
  targets:
    contrast_name: "pain_vs_nonpain"
    metric: "dot"
    method: "lss"
    normalization: "none"
    round_decimals: 3
    trials_per_block: 11
    names: ["NPS", "SIIPS1"]
    signature_manifest_path: "signature_manifest.yaml"
    signature_provenance:
      NPS:
        path: "NPS/weights_NSF_grouppred_cvpcr.nii.gz"
        space: "MNI152NLin2009cAsym"
      SIIPS1:
        path: "SIIPS1/nonnoc_v11_4_137subjmap_weighted_mean.nii.gz"
        space: "MNI152NLin2009cAsym"
    input_source: "fmriprep"
    fmriprep_space: "MNI152NLin2009cAsym"
    require_fmriprep: true
    condition_a_column: "pain_binary_coded"
    condition_a_value: "1"
    condition_b_column: "pain_binary_coded"
    condition_b_value: "0"
    condition_scope_trial_type_column: "trial_type"
    condition_scope_trial_types: ["stimulation"]
    condition_scope_phase_column: "stim_phase"
    condition_scope_stim_phases: ["plateau"]
    hrf_model: "spm"
    drift_model: "cosine"
    high_pass_hz: 0.008
    low_pass_hz: null
    smoothing_fwhm: null
    min_signature_support_fraction: 0.90
    max_signature_weight_mass_change_fraction: 0.10
    max_design_condition_number: 3000.0
    min_target_design_efficiency: 0.1
    confounds_strategy: "motion24+wmcsf+fd+compcor"
    lss_other_regressors: "all"
    nuisance_regression:
      enabled: true
      continuous_columns:
        - "block"
        - "onset"
        - "within_block_trial"
        - "hrf_weighted_framewise_displacement"
        - "hrf_weighted_std_dvars"
        - "hrf_weighted_fp1_fp2_high_frequency_power"
        - "residual_ecg_coupling"
      categorical_columns:
        - "stimulus_temp"
        - "selected_surface"
  feature_benchmark:
    n_perm: 5000
    inner_splits: 5
    outer_jobs: 1
    feature_harmonization: "intersection"
    excluded_channels: ["Fp1", "Fp2"]
    permutation_scheme: "circular_shift_within_run"
    max_invalid_permutation_fraction: 0.20
    circular_shift:
      min_valid_blocks_per_subject: 3
      min_retained_trials_per_subject: 25
  reporting:
    sensitivity_output_roots: []
  temporal_negative_controls:
    feature_transform: "raw_log_power"
    feature_baseline_window: null
    windows:
      prestimulus_wide: [-5.0, 0.0]
      immediate_prestimulus: [-0.2, 0.0]
    wrong_lag_windows:
      ramp_up: [0.0, 3.0]
      late_ramp_down: [10.5, 15.0]
      early_shifted_active: [1.0, 8.5]
      late_shifted_active: [5.0, 12.5]
  deep_regression:
    time_window: [3.0, 10.5]
    n_epochs: 25
    batch_size: 32
    learning_rate: 0.001
    weight_decay: 0.0001
    validation_fraction: 0.2
    patience: 5
    temporal_kernel_size: 15
    temporal_filters: 8
    dropout: 0.25
    use_cuda: false
    presets:
      alpha: ["alpha"]
      beta: ["beta"]
      gamma: ["gamma"]
      alpha_beta: ["alpha", "beta"]
      alpha_beta_gamma: ["alpha", "beta", "gamma"]
  outputs:
    root_name: "study1"

machine_learning:
  evaluation:
    bootstrap_iterations: 10000

pyprep:
  # Study 1 fits shared subject-level ICA and epochs across runs, so MNE-BIDS
  # stages use the subject-level bad-channel union while retaining per-run
  # PyPREP provenance in the bad-channel log.
  bad_channel_sync_policy: "subject_union"

preprocessing:
  clean_events_qc:
    peripheral_low_gamma:
      enabled: true
      output_column: "fp1_fp2_high_frequency_power"
      channels: ["Fp1", "Fp2"]
      band: [70.0, 95.0]
