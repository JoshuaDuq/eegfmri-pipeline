study1:
  cohort:
    min_subjects: 2
  features:
    exploratory_feature_families:
      - "spectral"
      - "aperiodic"
      - "erds"
      - "ratios"
      - "asymmetry"
      - "complexity"
      - "bursts"
  targets:
    contrast_name: "pain_vs_nonpain"
    metric: "dot"
    method: "lss"
    normalization: "none"
    round_decimals: 3
    names: ["NPS", "SIIPS1"]
    signature_provenance:
      NPS:
        path: "NPS/weights_NSF_grouppred_cvpcr.nii.gz"
        space: "MNI152NLin2009cAsym"
      SIIPS1:
        path: "SIIPS1/nonnoc_v11_4_137subjmap_weighted_mean.nii.gz"
        space: "MNI152NLin2009cAsym"
    input_source: "fmriprep"
    fmriprep_space: "MNI152NLin2009cAsym"
    require_fmriprep: true
    condition_a_column: "pain_binary_coded"
    condition_a_value: "1"
    condition_b_column: "pain_binary_coded"
    condition_b_value: "0"
    condition_scope_trial_type_column: "trial_type"
    condition_scope_trial_types: ["stimulation"]
    condition_scope_phase_column: "stim_phase"
    condition_scope_stim_phases: ["plateau"]
    hrf_model: "spm"
    drift_model: "cosine"
    high_pass_hz: 0.008
    low_pass_hz: null
    smoothing_fwhm: null
    confounds_strategy: "motion24+wmcsf+fd+compcor"
    lss_other_regressors: "all"
    nuisance_regression:
      enabled: false
      continuous_columns:
        - "block"
        - "onset"
        - "trial_index"
        - "framewise_displacement"
        - "std_dvars"
        - "peripheral_low_gamma_power"
        - "residual_ecg_coupling"
      categorical_columns:
        - "stimulus_temp"
        - "selected_surface"
  feature_benchmark:
    n_perm: 10
    inner_splits: 3
    outer_jobs: 1
    feature_harmonization: "intersection"
  deep_regression:
    n_epochs: 2
    batch_size: 8
    learning_rate: 0.001
    weight_decay: 0.0001
    validation_fraction: 0.2
    patience: 1
    temporal_kernel_size: 7
    temporal_filters: 4
    dropout: 0.1
    use_cuda: false
    presets:
      alpha: ["alpha"]
      alpha_beta: ["alpha", "beta"]
  outputs:
    root_name: "study1"
