# fMRI Pipeline Configuration
# ===========================
# Settings for fMRI preprocessing, contrast building, and BEM generation

paths:
  # FreeSurfer license file (required for fMRIPrep and BEM generation)
  # Get a free license at: https://surfer.nmr.mgh.harvard.edu/registration.html
  freesurfer_license: null  # Optional override (otherwise: EEG_PIPELINE_FREESURFER_LICENSE, then ~/license.txt)

  # fMRI BIDS root directory (raw fMRI data)
  bids_fmri_root: null

  # FreeSurfer SUBJECTS_DIR (structural MRI surfaces)
  freesurfer_dir: null

  # Root directory for multivariate signature weight maps.
  # Required when signature_maps is non-empty; the directory must exist.
  signature_dir: null

  # Multivariate signature weight maps to compute at each contrast/beta map.
  # Each entry must have a unique "name" and a "path" relative to signature_dir.
  # All configured signature files must exist; missing maps now error.
  # Leave empty ([]) to disable signature computation entirely.
  # Example (using two configured signatures):
  #   signature_maps:
  #     - name: "SIG_A"
  #       path: "maps/sig_a_weights.nii.gz"
  #     - name: "SIG_B"
  #       path: "maps/sig_b_weights.nii.gz"
  signature_maps: []

###################################################################
# fMRI Preprocessing (fMRIPrep)
###################################################################

fmri_preprocessing:
  task_is_rest: false
  engine: "docker"              # "docker" or "apptainer"
  fmriprep:
    image: "nipreps/fmriprep:25.2.5"  # Pinned fMRIPrep 25.2 LTS patch release
    output_dir: null            # Default: <deriv_root>/preprocessed/fmri
    work_dir: null              # Default: <deriv_root>/work/fmriprep
    fs_license_file: null       # Default: paths.freesurfer_license, then EEG_PIPELINE_FREESURFER_LICENSE, then ~/license.txt
    fs_subjects_dir: null       # Optional: FreeSurfer SUBJECTS_DIR
    
    # Output spaces (standard and subject-specific)
    output_spaces:
      - "MNI152NLin2009cAsym"
      # NPS and SIIPS1 are distributed on SPM/FSL MNI152 grids, so signature
      # scoring happens here rather than resampling the published weight maps.
      - "MNI152NLin6Asym"
      - "T1w"
    
    # Optional: ignore specific modalities (e.g., fieldmaps, slicetiming)
    ignore: []
    
    # Optional: BIDS filter file (JSON)
    bids_filter_file: null
    
    # Processing level: "full" (default), "resampling", "minimal"
    level: "full"
    output_layout: "bids"       # Required by this pipeline's derivative/report contract
    aggregate_session_reports: 4
    
    # CIFTI output: null (disabled), "91k", or "170k"
    cifti_output: null
    
    # Process only specific task (null = all tasks)
    task_id: null
    
    # Performance options
    nthreads: 0                 # Max threads across all processes (0 = auto)
    omp_nthreads: 1             # Required with fixed seeds for reproducible ANTs results
    mem_mb: 0                   # Memory limit in MB (0 = auto)
    low_mem: false              # Reduce memory usage
    
    # Anatomical options
    fs_no_reconall: false       # Disable FreeSurfer recon-all
    subject_anatomical_reference: "first-lex"  # "first-lex" | "unbiased" | "sessionwise"
    skull_strip_template: "OASIS30ANTs"  # Template for brain extraction
    skull_strip_fixed_seed: true   # Fixed seed for reproducibility
    
    # BOLD processing options
    bold2anat_init: "t1w"       # Explicit: "auto" would depend on T2w availability
    bold2anat_dof: 6             # Degrees of freedom for BOLD→anatomical registration
    slice_time_ref: 0.5         # Slice timing reference (0=start, 0.5=middle, 1=end)
    dummy_scans: null           # null = fMRIPrep detection; integer >= 0 = explicit override
    
    # Quality control thresholds
    fd_spike_threshold: 0.5     # Framewise displacement threshold (mm)
    dvars_spike_threshold: 1.5  # Standardized DVARS threshold
    
    # Surface options
    medial_surface_nan: false   # Fill medial surface with NaN
    no_msm: false               # Disable MSM-Sulc alignment to fsLR
    
    # Multi-echo options
    me_output_echos: false      # Output each echo separately
    
    # Reproducibility
    random_seed: 42             # Run-to-run replicability
    
    # Validation options
    skip_bids_validation: false
    stop_on_first_crash: false
    # --clean-workdir wipes the nipype cache at startup, so a job killed at the wall
    # limit restarts from scratch rather than resuming. Keep the cache.
    clean_workdir: false
    
    # Additional fMRIPrep arguments (parsed with shlex)
    extra_args: null

fmri_resting_state:
  task_is_rest: false
  task_label: "rest"
  input_source: "fmriprep"
  fmriprep_space: "MNI152NLin2009cAsym"
  require_fmriprep: true
  runs: null
  confounds_strategy: "motion24+wmcsf+fd+compcor"
  auto_compcor_n: 5
  high_pass_hz: 0.008
  low_pass_hz: 0.1
  smoothing_fwhm: null
  atlas_labels_img: null
  atlas_labels_tsv: null
  connectivity_kind: "correlation"
  standardize: true
  detrend: true


###################################################################
# BEM/Trans Generation (for EEG source localization)
###################################################################

# These settings are used by the EEG pipeline when fMRI-informed source
# localization is enabled. They control automatic generation of:
# - BEM model (scalp/skull/brain conductive boundaries)
# - BEM solution (forward model matrix)
# - Coregistration transform (EEG ↔ MRI alignment)

bem_generation:
  # NOTE: A valid EEG↔MRI transform requires digitization/coregistration.
  # Auto-generating an identity transform is not scientifically valid.
  create_trans: false         # Provide trans manually (recommended)
  allow_identity_trans: false # Set true only for debugging (not anatomy)
  create_model: true          # Auto-create BEM model (watershed surfaces)
  create_solution: true       # Auto-create BEM solution matrix
  docker_image: "freesurfer-mne:7.4.1"
  ico: 4                       # ICO downsampling (4 = 5120 triangles per surface)
  conductivity: [0.3, 0.006, 0.3]  # Conductivity for [scalp, skull, brain]


###################################################################
# fMRI Contrast Builder (for fMRI-informed EEG source localization)
###################################################################

# These settings control the building of fMRI statistical maps from BOLD data.
# The resulting maps are used to constrain EEG source localization.

fmri_contrast:
  enabled: false
  
  # Input source for BOLD data
  input_source: "fmriprep"     # "fmriprep" only; inferential first-level analysis rejects raw BIDS inputs
  fmriprep_space: "T1w"        # fMRIPrep output space
  require_fmriprep: true       # Fail if preproc BOLD or matching brain masks are missing
  output_dir: null             # Optional first-level output root
  freesurfer_dir: null         # Optional FreeSurfer SUBJECTS_DIR override
  
  # Contrast type and conditions
  type: "t-test"               # "t-test" | "custom"

  # Model the scoped trials as a continuous modulator instead of contrasting two of
  # their levels. Names any numeric events column; the fit gets a response regressor
  # plus a run-centred modulator, and the modulator is the contrast. Every scoped trial
  # contributes, so it does not depend on any one level being present in every run.
  # Mutually exclusive with condition_a/condition_b.
  parametric_column: null      # e.g. "stimulus_temp", "stimulus_db", "reward_magnitude"
  
  # Condition A: column and value to select trials
  condition_a:
    column: "trial_type"        # Column name in events.tsv
    value: null                 # Value to filter for (set explicitly for your paradigm)
  
  # Condition B: column and value for comparison (optional)
  condition_b:
    column: "trial_type"
    value: null

  # Optional: restrict condition-based event selection to specific values.
  # Values are matched against `condition_scope_column`.
  # If null, no condition-scope filtering is applied.
  condition_scope_trial_types: null  # e.g., ["stimulation"]
  # Events column used for `condition_scope_trial_types`.
  condition_scope_column: "trial_type"

  # Optional: restrict which event phases are modeled by the GLM (by events.tsv trial_type).
  # If null, all event rows are modeled (default).
  events_to_model: null
  events_to_model_column: "trial_type"

  # Events column used for phase-level scoping.
  phase_column: "stim_phase"

  # Optional: restrict which phase values are modeled using `phase_column`.
  # If set, `phase_column` must exist in events.tsv.
  # If null, no phase scoping is applied.
  # Use ["all"] to disable scoping and model all phase values.
  stim_phases_to_model: null

  # Events column used to scope phase filtering to a subset of rows.
  phase_scope_column: "trial_type"

  # Optional: value in `phase_scope_column` that phase scoping is restricted to.
  # If set, `phase_scope_column` must exist in events.tsv.
  # If null, phase scoping applies to all rows.
  phase_scope_value: null

  # Custom formula (optional, overrides condition_a/b)
  formula: null                # e.g., "condition_a - condition_b"
  
  # Contrast output
  name: "contrast"      # Output contrast name
  runs: null                   # List of run numbers (null = auto-detect; explicit requests must all resolve)
  
  # GLM settings
  hrf_model: "spm"             # "spm" | "flobs" | "fir"
  drift_model: "cosine"        # "none" | "cosine" | "polynomial"
  high_pass_hz: 0.008          # High-pass filter (128s period)
  low_pass_hz: null            # Optional; avoid unless you know you need it
  smoothing_fwhm: null         # Optional spatial smoothing kernel FWHM in mm
  confounds_strategy: "motion24+wmcsf+fd+compcor"  # Fixed across runs; "auto" is deliberately not the default
  auto_compcor_n: 5             # Number of CompCor components included when confounds_strategy includes CompCor
  write_design_matrix: false    # Write design matrix TSV/PNG under qc/
  
  # Output format: which map is written as the contrast's headline output.
  #   "z-score" | "t-stat" | "cope" | "beta"  (beta aliases cope/effect_size)
  # This no longer decides what the report thresholds. A z map is always written
  # beside the requested output and is what inference runs on, because every height
  # the report quotes -- the applied threshold, FDR, Bonferroni, random-field -- is a
  # z-scale quantity, and Nilearn's threshold_stats_img states that on a non-z input
  # the computed threshold is "not rigorous and likely meaningless". Group analysis
  # takes the effect_size maps, so "cope" remains a reasonable choice.
  output_type: "z-score"
  resample_to_freesurfer: true # Auto-resample to FreeSurfer subject space

###################################################################
# fMRI Statistical Artifacts
###################################################################

fmri_stats:
  space: "native"              # "native" | "mni" | "both"; MNI/both fits an additional standard-space model
  include_effect_size: true    # Required for effect/evidence and dual-coded report panels
  include_standard_error: true # Saves effect variance for uncertainty panels
  include_signatures: true     # Evaluated only when signature maps are configured
  threshold_mode: "z"          # "z" | "fdr" | "none"
  z_threshold: 2.3
  fdr_q: 0.05
  cluster_min_voxels: 0        # Display extent filter only; 0 disables it
  two_sided: true

###################################################################
# fMRI Subject Report (renders existing first-level derivatives only)
###################################################################

fmri_report:
  enabled: true
  html_report: true
  formats: ["png"]             # Dense maps: PNG; line/design panels are also SVG
  include_unthresholded: true  # Diagnostic only; shown separately from inference
  include_motion_qc: true
  include_carpet_qc: true
  include_tsnr_qc: true
  include_design_qc: true
  embed_images: true           # Self-contained HTML
  atlas_labels_img: null       # Optional study-pinned MNI label volume
  atlas_labels_tsv: null       # Optional index/name table for atlas_labels_img

###################################################################
# fMRI Group-Level Analysis
###################################################################

fmri_group_level:
  enabled: false
  # "one-sample" | "two-sample" | "paired" | "repeated-measures"
  model: "one-sample"
  # First-level contrast names to consume.
  # one-sample/two-sample: exactly 1
  # paired: exactly 2 ordered as [A, B]
  # repeated-measures: >=2
  contrast_names: []
  # Optional human-readable labels corresponding to contrast_names.
  # Defaults to contrast_names when null.
  condition_labels: null
  # Optional root containing first-level outputs.
  # Default: deriv_root
  # Use this when first-level outputs were written to a shared custom output dir.
  input_root: null
  # Optional custom second-level contrast formula over the generated design matrix columns.
  # Examples:
  #   two-sample: "group_patient - group_control"
  #   repeated-measures: "condition_high - condition_low"
  # If null:
  #   one-sample -> intercept
  #   two-sample -> group_b - group_a
  #   paired -> intercept on subject-wise (B - A) difference maps
  #   repeated-measures -> omnibus F-test across conditions
  formula: null
  # Optional output label; defaults to a value derived from the design/formula.
  output_name: null
  output_dir: null
  # Write second-level design matrix TSV/PNG into <output>/qc/.
  write_design_matrix: true

  # Subject-level TSV/CSV for group assignments and numeric covariates.
  covariates_file: null
  subject_column: "subject"
  # Numeric nuisance covariates (centered before fitting).
  # Supported for one-sample, two-sample, and paired designs.
  covariate_columns: []

  # Required for two-sample designs.
  group_column: null
  group_a_value: null
  group_b_value: null

  permutation:
    enabled: false
    n_permutations: 5000
    two_sided: true
    random_state: 42
    # Threshold-free cluster enhancement, from the same permutation run. Nilearn
    # warns it increases run time considerably; measured here at ~33 min for 5000
    # permutations over an 85k-voxel mask.
    tfce: false
    # Cluster-forming threshold for cluster-extent and cluster-mass FWE, in
    # p-scale: Nilearn converts it to a t height itself, so 0.001 is the
    # conventional p < 0.001. null skips cluster-level inference.
    cluster_forming_p: null

  # Parametric inference displayed in the cohort report. The procedure is chosen
  # before the cohort maps are read; the report never tunes a threshold to the data.
  threshold:
    # "fdr" | "fpr" | "bonferroni" | "none"
    height_control: "fdr"
    alpha: 0.05
    # Used only when height_control is "none".
    uncorrected_z_threshold: 3.09
    # Display extent filter only; this is not cluster-level corrected inference.
    cluster_min_voxels: 0
    two_sided: true
    min_distance_mm: 8.0

  report:
    enabled: true
    html_report: true
    formats: ["png"]           # Dense maps: PNG; design/matrix panels are also SVG
    embed_images: true
    include_design_correlation: true  # Official Nilearn plot when 3–20 regressors
    include_input_map_concordance: true  # Spatial correlation QC across fitted maps
    # Refit without each participant and rethreshold. Correlation is scale-invariant,
    # so the concordance panel above cannot see a participant who carries or suppresses
    # the group mean by amplitude. Costs one extra fit per participant, no permutations.
    include_leave_one_out_influence: true
    # Residuals of the reported design against the Gaussian errors the report assumes.
    include_residual_diagnostics: true
    # Nilearn's view_img, inlined: self-contained, offline, roughly 0.6 MB of HTML.
    include_interactive_viewer: true
    include_true_discovery_proportion: true  # Nilearn ARI bound per surviving cluster
    include_unthresholded: true
    cluster_table_max_rows: 10  # Leading clusters in HTML; TSV always retains all rows
    # Names the structure each cluster peak falls in. Supplied by the study, like
    # fmri_report's, so the report needs no network. Must be an MNI label volume:
    # second-level coordinates are MNI.
    atlas_labels_img: null
    atlas_labels_tsv: null
    # Cortical mesh for the surface panel, e.g. "fsaverage". Off by default:
    # Nilearn downloads a mesh it cannot find, and a report reading a derivatives
    # tree offline must not fetch one as a side effect of drawing a figure.
    surface_mesh: null
