###################################################################
# 1. PROJECT & PATHS
###################################################################
###################################################################
# This is the *packaged default* config, and it describes one study: a thermal-pain
# EEG-fMRI acquisition. Keys marked STUDY-SPECIFIC below encode that paradigm and
# almost certainly need changing for anything else.
#
# Do not edit this file to configure your own study. It lives inside the installed
# package, so edits are lost on reinstall and two studies cannot coexist. Instead write
# your own YAML that extends a preset:
#
#     # my_study.yaml
#     extends: "rest"     # or "../path/to/another.yaml"
#     project:
#       task: "oddball"
#     paths:
#       bids_root: "/data/my_study/bids"
#       deriv_root: "/data/my_study/derivatives"
#
#     eeg-pipeline --config my_study.yaml preprocessing full --all-subjects
#
# Only the keys you name are overridden; everything else is inherited, so later
# corrections to the scientific defaults here reach your study too. The available
# presets are in utils/config/presets/. `eeg-pipeline validate --config-only` reports
# contradictions without processing anything.
###################################################################
project:
  # Deliberately unset when inherited: the BIDS task label selects which
  # recordings are read, and taking another study's would quietly process
  # nothing. validate --config-only names this key until it is set.
  task: "thermalactive"  # STUDY-SPECIFIC: BIDS task label used in paths and file naming
  # "task" (event-related) or "rest" (fixed-length segments). Sets preprocessing,
  # feature_engineering and both fMRI task_is_rest flags together, overriding whatever
  # they say individually — those four were never independent choices, only four places
  # to make the same one. Leave null to keep setting them by hand.
  paradigm: "task"
  random_state: 42  # Primary random seed for reproducible analyses
  subject_list: null  # Optional list of subjects to process (null = all found)

paths:
  # The line-cleaned copy, because that is what the pipeline is actually run against: every
  # delivered run passed --bids-root .../eeg_linecleaned on the command line while this said
  # "eeg", so the data depended on a flag someone had to remember. 81 of 119 recorded
  # preprocessing runs carried the flag and the rest did not. Producing the cleaned copy is
  # `eeg-pipeline line-comb apply`, whose own config pins the raw root it reads.
  # The post-Decomb tree, staged so that MNE-BIDS-Pipeline finds it: the Decomb output
  # names its recordings desc-decomb while the sidecars stay desc-less, and preprocessing
  # cannot read that layout until the pair is reconciled. eeg_linecleaned, which this
  # pointed at, is the earlier line-comb copy and still carries the lines Decomb removes:
  # on sub-0001 run-1 the 47 Hz line is untouched there and 19 dB down in the staged tree,
  # and the delivered derivatives carry the 34 dB stopband that only the staged tree
  # explains. The config named one input while the science was built on another.
  bids_root: "../../../data/bids_output/eeg_decombed_auto_staged"  # BIDS-formatted EEG data
  # Null preserves ordinary datasets. A configured Decomb manifest activates spectral
  # exclusions and requires preprocessing.notch_freq: null.
  #
  # Where a study's line-removal stage recorded which frequencies it took out. The
  # mechanism is general -- every panel that reads power at a frequency needs to know
  # where the holes are, or it treats a 30 dB stopband as data and fits slopes across
  # gaps it cannot recognise. null because only a study knows whether its recordings
  # were cleaned that way; this study sets it in studies/pain_study/config/pain_study.yaml.
  decomb_manifest: null
  bids_rest_root: null  # Optional resting-state EEG BIDS directory used when task_is_rest is enabled
  bids_fmri_root: "../../../data/bids_output/fmri"  # BIDS-formatted fMRI data directory (for contrast builder)
  deriv_root: "../../../data/derivatives"  # Processed derivatives output directory
  deriv_rest_root: null  # Resting-state EEG derivatives directory used when task_is_rest is enabled
  source_data: "../../../data/source_data"  # Raw source data directory
  freesurfer_dir: "../../../data/derivatives/freesurfer"  # FreeSurfer SUBJECTS_DIR (contains subject directories)
  freesurfer_license: null  # Path to FreeSurfer license.txt (otherwise use EEG_PIPELINE_FREESURFER_LICENSE, then ~/license.txt)
  signature_dir: null  # Root directory for multivariate signature weight maps
  signature_maps: []  # List of {name, path} entries relative to signature_dir

###################################################################
# 1a. ENVIRONMENT
###################################################################
environment:
  thread_limits: {}

###################################################################
# 1b. fMRI PREPROCESSING (fMRIPrep-style)
###################################################################
fmri_preprocessing:
  task_is_rest: false
  engine: "docker"  # "docker" or "apptainer"
  fmriprep:
    image: "nipreps/fmriprep:25.2.5"  # Pinned fMRIPrep 25.2 LTS patch release
    output_dir: null  # BIDS derivatives root (null = <deriv_root>/preprocessed/fmri)
    work_dir: null  # Scratch/work directory (null = <deriv_root>/work/fmriprep)
    fs_license_file: null  # FreeSurfer license.txt (null = paths.freesurfer_license, then EEG_PIPELINE_FREESURFER_LICENSE, then ~/license.txt)
    fs_subjects_dir: null  # Optional FreeSurfer SUBJECTS_DIR
    output_spaces: ["MNI152NLin2009cAsym", "T1w"]
    ignore: []  # e.g., ["fieldmaps", "slicetiming"]
    bids_filter_file: null  # Optional BIDS filter JSON (path)
    level: "full"  # "full", "resampling", or "minimal"
    output_layout: "bids"
    aggregate_session_reports: 4
    cifti_output: null  # Optional dense timeseries output: null, "91k", or "170k"
    task_id: null  # Optional task filter for preprocessing
    nthreads: 0  # 0 = auto
    omp_nthreads: 1  # Required with fixed seeds for reproducible ANTs results
    low_mem: false
    subject_anatomical_reference: "first-lex"
    skull_strip_template: "OASIS30ANTs"
    skull_strip_fixed_seed: true
    bold2anat_init: "t1w"  # Explicit: "auto" would depend on T2w availability
    bold2anat_dof: 6
    slice_time_ref: 0.5
    dummy_scans: null  # null = fMRIPrep detection; integer >= 0 = explicit override
    fd_spike_threshold: 0.5
    dvars_spike_threshold: 1.5
    skip_bids_validation: false
    clean_workdir: true
    stop_on_first_crash: false
    fs_no_reconall: false
    mem_mb: 0  # 0 = fMRIPrep default
    medial_surface_nan: false
    no_msm: false
    me_output_echos: false
    random_seed: 42
    extra_args: ""  # Parsed with shlex and appended verbatim to fMRIPrep CLI

fmri_resting_state:
  task_is_rest: false
  task_label: "rest"
  input_source: "fmriprep"
  fmriprep_space: "MNI152NLin2009cAsym"
  require_fmriprep: true
  runs: null
  confounds_strategy: "motion24+wmcsf+fd+compcor"
  auto_compcor_n: 5
  high_pass_hz: 0.008
  low_pass_hz: 0.1
  smoothing_fwhm: null
  atlas_labels_img: null
  atlas_labels_tsv: null
  connectivity_kind: "correlation"
  standardize: true
  detrend: true

###################################################################
# 1c. fMRI ANALYSIS
###################################################################

fmri_contrast:
  enabled: false
  input_source: "fmriprep"
  fmriprep_space: "T1w"
  require_fmriprep: true
  type: "t-test"
  output_dir: null
  freesurfer_dir: null
  condition_a:
    column: "trial_type"
    value: null
  condition_b:
    column: "trial_type"
    value: null
  condition_scope_trial_types: null
  condition_scope_column: "trial_type"
  events_to_model: null
  events_to_model_column: "trial_type"
  phase_column: "stim_phase"
  stim_phases_to_model: null
  phase_scope_column: "trial_type"
  phase_scope_value: null
  formula: null
  name: "contrast"
  runs: null
  hrf_model: "spm"
  drift_model: "cosine"
  high_pass_hz: 0.008
  low_pass_hz: null
  smoothing_fwhm: null
  confounds_strategy: "motion24+wmcsf+fd+compcor"
  auto_compcor_n: 5
  write_design_matrix: false
  output_type: "z-score"
  resample_to_freesurfer: true

fmri_stats:
  space: "native"
  include_effect_size: true
  include_standard_error: true
  include_signatures: true
  threshold_mode: "z"
  z_threshold: 2.3
  fdr_q: 0.05
  cluster_min_voxels: 0
  two_sided: true

fmri_report:
  enabled: true
  html_report: true
  formats: ["png"]
  include_unthresholded: true
  include_motion_qc: true
  include_carpet_qc: true
  include_tsnr_qc: true
  include_design_qc: true
  embed_images: true
  atlas_labels_img: null
  atlas_labels_tsv: null

fmri_group_level:
  enabled: false
  model: "one-sample"
  contrast_names: []
  condition_labels: null
  input_root: null
  formula: null
  output_name: null
  output_dir: null
  write_design_matrix: true
  covariates_file: null
  subject_column: "subject"
  covariate_columns: []
  group_column: null
  group_a_value: null
  group_b_value: null
  permutation:
    enabled: false
    n_permutations: 5000
    two_sided: true
  report:
    # Names the structure each cluster peak falls in. Study-pinned rather than fetched,
    # so the report needs no network. AAL3v2 rather than Schaefer2018: Schaefer is
    # cortical grey matter only and left every cerebellar peak in this contrast
    # unlabelled, where AAL covers cortex, subcortex and cerebellum (9 of 10 leading
    # peaks against 5 of 10).
    #
    # AAL is defined in SPM's MNI, not MNI152NLin2009cAsym, so a peak near a parcel
    # boundary can fall on the wrong side of it by a few millimetres. That is the price
    # of the coverage; the alternative was naming nothing at all in the cerebellum.
    atlas_labels_img: "/Volumes/KINGSTON/EEG_fMRI_data/external/atlases/tpl-MNI152_atlas-AAL3v2_dseg.nii.gz"
    atlas_labels_tsv: "/Volumes/KINGSTON/EEG_fMRI_data/external/atlases/tpl-MNI152_atlas-AAL3v2_dseg.tsv"
    surface_mesh: "fsaverage"

###################################################################
# 2. DEFINITIONS & ANCHORS
###################################################################

# 2.1 Frequency Bands
frequency_bands: &frequency_bands
  delta: [1.0, 3.9]
  theta: [4.0, 7.9]
  alpha: [8.0, 12.9]
  beta: [13.0, 30.0]
  beta_low_clean: [13.0, 17.9]
  beta_high_clean: [23.1, 30.0]
  gamma: [30.1, 80.0]
  gamma_low_clean: [30.1, 38.0]
  gamma_mid_clean: [43.0, 56.0]
  gamma_high_clean: [67.0, 77.0]

# 2.2 Time Windows
time_windows:
  # STUDY-SPECIFIC: when the thermal stimulus is on. Anchored to the event, so it is
  # meaningless for a resting-state run.
  active: &active_window [3.0, 10.5]  # Active/task period [s]
  # A time-frequency baseline window must clear the taper half-width at BOTH ends.
  # The tapers are centred, so a window reaching nearer to the event than one half-width
  # estimates "pre-stimulus" power partly from post-stimulus data. That leak scales with
  # each condition's own response, so it biases condition differences instead of
  # cancelling in them (measured: a true 6.02 dB difference reported as 3.93 dB).
  # The same applies at the epoch boundary, where the window would draw on padding.
  #
  # One value cannot serve estimators with different taper widths, so the windows are
  # split by the estimator that consumes them.
  #
  # Morlet, n_cycles = clip(f/2, 3, 15) from 1 Hz: worst half-width 2.39 s at 1 Hz.
  # With epochs.tmin = -7.0 the widest valid window is [-4.6, -2.4].
  baseline_tfr_morlet: &baseline_window_tfr_morlet [-4.6, -2.4]
  # Multitaper with a constant 1.0 s window: half-width 0.5 s.
  baseline_tfr_multitaper: &baseline_window_tfr_multitaper [-5.0, -0.5]

# 2.3 Numeric Guards
numeric:
  epsilon_std: &epsilon_std 1e-12
  epsilon_psd: &epsilon_psd 1e-20
  epsilon_amp: &epsilon_amp 1e-10
  log_base: &log_base 10.0
  percentage_multiplier: &percentage_multiplier 100.0

# 2.4 ROI Regex Patterns
# NOTE: Laterality labels (Ipsi_L, Contra_R) assume LEFT-SIDE stimulation.
# If stimulation side varies, either:
#   1. Flip channel labels per-trial before feature extraction, OR
#   2. Use hemisphere-neutral ROI names (Left/Right instead of Ipsi/Contra)
# The current labels are valid ONLY for consistent left-side stimulation.
rois: &roi_definitions
  Frontal: ["^(Fp2|Fpz|AF3|AF7|AF8|F1|F2|F3|F5|F6|F7|F8)$"]
  Sensorimotor_Right: ["^(FC4|FC6|C2|C6|CP2|CP4|CP6)$"]
  Sensorimotor_Left: ["^(FC5|C1|C3|C5|CP3|CP5)$"]
  Temporal_Right: ["^(FT8|FT10|T8|TP8|TP10)$"]
  Temporal_Left: ["^(FT7|FT9|T7|TP7|TP9)$"]
  ParOccipital_Right: ["^(P2|P4|P6|P8|PO4|PO8|O2)$"]
  ParOccipital_Left: ["^(P1|P3|P5|P7|PO3|PO7|O1)$"]
  ParOccipital_Midline: ["^(Pz|POz|Oz)$"]

###################################################################
# 3. CORE PROCESSING PIPELINE
###################################################################
event_columns:
  predictor: ["predictor", "stimulus_intensity", "intensity", "dose", "stimulus_temp", "stimulus_temperature", "temp", "temperature"]
  outcome: ["outcome", "rating", "response", "score", "confidence", "accuracy", "vas_final_coded_rating", "vas_final_rating", "vas_rating", "pain_intensity", "pain_rating"]
  condition: ["condition", "condition_label", "trial_type", "event_type"]
  # Optional: restrict strict event validation to these logical groups.
  # Keep as ["outcome"] for paradigm-agnostic use; add "predictor"/"condition"/"binary_outcome"
  # when those analyses are required.
  required: ["outcome"]
  binary_outcome: ["binary_outcome", "binary_outcome_coded", "outcome_binary", "label", "pain"]

alignment:
  allow_misaligned_trim: false
  min_alignment_samples: 5
  fmri_onset_reference: "first_iti_start"  # fMRI raw_to_bids: event onsets relative to first ITI

eeg:
  montage: "easycap-M1"
  ch_types: "eeg"
  reference: "average"
  # This montage has no dedicated EOG electrode, so blink recovery needs surrogates named
  # here. Left null, MNE-BIDS-Pipeline finds no EOG channel, breaks out of its ocular
  # detection loop without raising, and reports zero ocular components — indistinguishable
  # from a participant who never blinked. Upstream treats these as *virtual* EOG: they
  # stay in the EEG analysis and are not removed from it.
  #
  # Because the surrogates are themselves in the ICA decomposition, component-to-surrogate
  # correlation is partly circular. That is the same caveat ica.ocular_review already
  # states and reports; it is a weaker detector than a true EOG lead, not an absent one.
  eog_channels: ["Fp1", "Fp2"]
  # ---------------------------------------------------------------------------
  # DO YOU HAVE AN ECG LEAD?
  # ---------------------------------------------------------------------------
  # Recording ECG is ordinary and useful, and nothing here depends on how it was
  # acquired. Name the
  # channel exactly as channels.tsv names it, and switch the two stages that read it on:
  #
  #     eeg:
  #       ecg_channels: ["ECG"]        # exactly as the channel is named in channels.tsv
  #     ica:
  #       cardiac_review:
  #         enabled: true              # detects R peaks in the lead; reviews ICA components
  #     preprocessing:
  #       clean_events_qc:
  #         ecg_coupling:
  #           enabled: true            # correlates EEG against the lead
  #
  # Leave ecg_channels empty for a montage without one: naming a channel that does not
  # exist fails at the recording rather than in the config. The cardiac review reads a
  # beat-marker train where ica.cardiac_review.marker_description names one and otherwise
  # detects R peaks from the channel directly. ICLabel labels cardiac components either
  # way, and the ocular review is unaffected by all of this.
  ecg_channels: ["ECG"]

preprocessing:
  resample_freq: 500
  l_freq: 0.1
  h_freq: 100
  # Set this to your mains frequency to have the pipeline remove it with a wide FIR
  # notch. Leave it null only when something upstream has already removed the lines and
  # says so through paths.decomb_manifest: a fixed notch on top of per-recording removal
  # adds a stopband the manifest does not describe, and check_config_coherence requires
  # the manifest to be the single authoritative account of which frequencies are gone.
  # Null here because the dataset this repository was developed on is in that state.
  #
  # Why a wide notch rather than spectrum_fit or ZapLine, for a dataset where the
  # pipeline does remove mains itself: mains is often not one line. Measured on this
  # cohort, 59-61 Hz carried 32-38 distinct peaks above 3 dB at 0.002 Hz resolution, and
  # removing the tallest only surfaces the next -- the narrow pass left 60 Hz at
  # +8.04 dB median over background in 13 of 15 participants. On one subject, as a change
  # in absolute 59.5-60.5 Hz power, spectrum_fit took 2.77 dB and ZapLine 1.65 dB against
  # 56.66 dB for the 0.97 Hz notch (59.537-60.463 Hz), which measured 0.00 dB collateral
  # in both 45-58 and 62-95 Hz because its whole footprint lies inside the unanalysed
  # 58-62 gap. A cohort whose mains really is a single line can afford the narrow pass.
  #
  # NOTE: the derivatives currently on disk were produced with this set to 60, so they
  # carry a 56.5-61.0 Hz hole that is partly this notch. Preprocessing has to be re-run
  # for the delivered data to match this configuration.
  notch_freq: null
  line_freq: 60

  # The acquisition room's line comb is removed before this pipeline reads the data, by
  # `eeg-pipeline line-comb apply`. Its settings describe one room and are therefore
  # paradigm-specific: they live with the code that applies them, in
  # studies/pain_study/scripts/line_comb/config.yaml.
  # Worker count for PyPREP's loop over recordings and for MNE-BIDS-Pipeline's loop over
  # subjects and runs, including the autoreject threshold search that ica.reject and
  # epochs.reject both request. It selects how the work is executed, not what is
  # computed: every worker reads the same inputs, the seeds are fixed, and results are
  # reassembled by index rather than by completion order.
  #
  # 6 rather than -1 because -1 also enlists efficiency cores, which finish their share
  # late and hold up the whole batch, and because each worker holds its own preloaded
  # recording — RAM, not cores, is the ceiling that gets hit first. Raise it only after
  # watching memory during a run.
  n_jobs: 6
  random_state: 42
  # Heuristics for condition auto-detection in BIDS events.tsv.
  # Empty disables prefix preference filtering.
  condition_preferred_prefixes: []
  task_is_rest: false              # True = fixed-length resting-state epochs, no event conditions
  rest_epochs_duration: 10.0       # Fixed-length resting-state epoch duration [s]
  rest_epochs_overlap: 0.0         # Resting-state epoch overlap [s]
  find_breaks: true
  # Persist AutoReject's per-channel, per-epoch verdict as a derivative.
  #
  # MNE-BIDS-Pipeline fits AutoReject, uses the reject log for one log line and one
  # report figure, and discards it. That log is the only record of which channel-in-trial
  # samples are measured and which are spline estimates from neighbouring electrodes, and
  # the distinction changes what some features mean: an interpolated channel is by
  # construction a weighted sum of its neighbours, so connectivity between it and those
  # neighbours — wPLI, AEC, and anything built on a CSD transform — is partly set by the
  # interpolation rather than by the brain. Measured on this cohort, 5-11% of
  # channel-trial cells are interpolated, each spanning the full 22 s epoch.
  #
  # Producing it refits AutoReject on the same pre-rejection epochs with the same
  # settings, which roughly doubles the cost of the epoching step. The refit is checked
  # against the cleaned epochs it describes, so a fit that diverged is an error rather
  # than a wrong sidecar. Requires epochs.reject = "autoreject_local".
  autoreject_log: true
  write_clean_events: true           # Write post-rejection (kept-epochs) *_proc-clean_events.tsv in derivatives
  clean_events_overwrite: true       # Overwrite existing clean events.tsv
  clean_events_strict: true          # Fail preprocessing if clean events.tsv cannot be written/aligned
  clean_events_qc:
    enabled: true
    ecg_coupling:
      enabled: true
      output_column: "residual_ecg_coupling"
      channels: ["ECG"]
      window: *active_window
    peripheral_low_gamma:
      enabled: true
      output_column: "peripheral_low_gamma_power"
      channels: ["Fp1", "Fp2", "FT9", "FT10", "TP9", "TP10"]
      band: [30.0, 45.0]
      window: *active_window

pyprep:
  # Low-pass applied before bad-channel detection only. null = none, which is the right
  # default: PyPREP's high-frequency-noise criterion is the ratio of a channel's >50 Hz
  # amplitude to its <50 Hz amplitude, so a low-pass deletes the band the criterion is
  # defined on. This used to be wired to preprocessing.h_freq, which on 1000 Hz data cut
  # everything above 100 Hz — where contact and electrode noise live — and left the
  # detector reading a 50-100 Hz sliver with the line notch cut out of it. The notch is
  # still applied; MATLAB PREP removes line noise before detection too.
  detection_low_pass: null
  ransac: true
  repeats: 3
  # "subject_union": a channel bad in any run of a participant is excluded from all of them,
  # so every run of a participant carries the same montage. "per_run" keeps run-specific
  # bads. The default matches how the cohort was actually processed -- leaving it at
  # "per_run" while every run passed --bad-channel-sync-policy subject_union made the
  # delivered data depend on a flag someone had to remember.
  bad_channel_sync_policy: "subject_union"  # "per_run" or "subject_union"
  average_reref: false
  file_extension: ".vhdr"
  # false: bad channels are PyPREP's verdict on this recording, every run, and nothing else.
  #
  # When true, a channel marked bad from outside the pipeline -- hand-edited into
  # channels.tsv, or inherited from an upstream conversion -- is carried forward untouched.
  # That state lives only in a regenerated file: a BIDS re-conversion on 2026-08-01 reset all
  # 64 channels to "good" across the cohort and silently dropped sixteen such marks, and
  # nothing failed. PyPREP's own marks are unaffected either way; they are re-measured on
  # every run rather than assumed, which is what stops a once-flagged channel ratcheting.
  #
  consider_previous_bads: false
  overwrite_chans_tsv: true
  delete_breaks: false
  breaks_min_length: 20
  t_start_after_previous: 2
  t_stop_before_next: 2
  random_state: null  # null = inherit project.random_state

ica:
  algorithm: "extended_infomax"
  # Average referencing removes one degree of freedom and every excluded channel removes
  # another, so the data are rank-deficient and asking for all components yields split
  # and ghost components that ICLabel then has to label.
  #
  # null is the rank-safe answer to that, not a variance fraction. MNE resolves null to
  # 0.999999, which is documented as its guard against rank-deficient whitening: it keeps
  # the decomposition inside the true rank whatever the bad-channel count turns out to
  # be, which is exactly what this setting wanted.
  #
  # A lower fraction does not do the same job: it is a variance criterion and can stop
  # early when artifact owns much of the variance. Dimensions outside the fit are restored
  # unmodified by ICA.apply, so the report states their count explicitly.
  n_components: null
  l_freq: 1.0
  h_freq: 100.0
  reject: "autoreject_local"
  use_icalabel: true
  # ICLabel was trained on scalp EEG carrying no strong cardiac field artifact, where it
  # never saw pulse-artifact components; it under-calls them as "heart beat" and they land in
  # its "other" catch-all, which this config retains. CTPS scoring against the recorded
  # ECG is the detector that does transfer, so it provides the automated baseline and the
  # manual review adjusts it rather than being the only line of defence.
  use_ecg_detection: true
  # CTPS threshold the ECG detector flags a component on. Null leaves it to
  # MNE-BIDS-Pipeline, whose default is 0.1 -- which is what every run of this pipeline
  # has used, so null preserves them exactly.
  #
  # Set this from the acquisition protocol before processing. The MNE-BIDS-Pipeline
  # default is 0.1; ordinary EEG outside the scanner should normally use MNE's 0.25 CTPS
  # default instead. Do not tune the threshold from a participant's component scores.
  ecg_threshold: null
  use_eog_detection: true
  require_manual_review: true
  # A shipped configuration cannot attest to a human action. Run ICA and review every row
  # of *_proc-ica_components.tsv against the component dossiers. A new ICA writes every
  # manual_review_status as "pending"; change each to "reviewed" and fill
  # manual_reviewed_by plus the ISO-8601 manual_reviewed_at timestamp with timezone. Then
  # override this to true only for the separate epochs run. The epoch gate validates the
  # row-level attestations. Set this back to false before refitting ICA.
  manual_review_complete: false
  process_raw_clean: true
  probability_threshold: 0.8
  labels_to_keep: ["brain", "other"]
  # Optional manual-review evidence for residual cardiac artifact. Beat times come from
  # a marker train where the recording carries one and beat_source allows it, otherwise
  # from R-peak detection on the ECG channel.
  cardiac_review:
    enabled: true
    ecg_channel: "ECG"
    # Where beat times come from.
    #   markers  read the annotation named below; fail if it yields too few beats
    #   detect   run find_ecg_events on the ECG channel, ignoring any markers
    #   auto     prefer markers where present, fall back to detection
    beat_source: auto
    # Annotation carrying one mark per heartbeat, exactly as the recording spells it.
    # Null means the recording carries none, which is the ordinary case: a montage with
    # an ECG lead and no marker train detects from the channel.
    marker_description: null
    # Coupling between the beat train and each ICA component, by cross-trial phase
    # statistics. Runs when this review is enabled and a beat source resolves.
    marker_ctps_qc:
      ctps_threshold: 0.1
      ctps_epoch_window: [-0.25, 0.5]
      baseline: [-0.25, -0.05]
      measurement_window: [-0.05, 0.4]
    epoch_window: [-0.4, 0.6]
    baseline: [-0.4, -0.1]
    measurement_window: [0.0, 0.4]
    ctps_threshold: "auto"
    representative_window_seconds: 10.0
    # Write this review's CTPS detections into *_proc-ica_components.tsv as exclusions.
    #
    # MNE-BIDS-Pipeline's own ECG step samples the first run, whereas a decomposition may
    # be fitted across several runs. Cardiac topography can change with head position, so
    # this review applies the same configured CTPS rule independently to every run.
    #
    # It changes the cleaned data, not just the report, which is why it is explicit. The
    # manual review still runs afterwards and can undo any of it; each promoted row names
    # the runs that flagged it in status_description.
    promote_exclusions: true
    # Fraction of usable runs that must flag a component before it is promoted. One run
    # out of six disagreeing is as likely to be a threshold crossing as a cardiac
    # component, so a bare majority is the floor rather than any single detection.
    promotion_minimum_run_fraction: 0.5
  # Optional manual-review evidence for residual ocular artifact. Blinks are detected
  # from the configured ocular channels; no component is excluded by this review.
  ocular_review:
    enabled: true
    # "eog" uses every channel typed as EOG. This montage has no dedicated EOG
    # electrode, so frontopolar EEG channels stand in as blink surrogates. Because
    # those channels are themselves part of the ICA decomposition, component-to-
    # surrogate correlation is partly circular; the report states this caveat and
    # excludes the surrogates from the global-field-power panels.
    eog_channels: ["Fp1", "Fp2"]
  band_specific_report:
    enabled: true
    fit_decim: 2
    # Write the exploratory band decompositions to their own HTML beside the subject
    # report, linked from it, instead of inlining them.
    #
    # They control nothing in the subject report, and ICLabel was not validated for
    # narrow-band decompositions. Split out, the evidence remains one click away without
    # crowding the authoritative broadband review. Set false for one self-contained file.
    exploratory_separate_file: true
    # Frequency ranges the AUTHORITATIVE per-component review draws a dossier over.
    #
    # Not the same list as the exploratory bands above. Those each fit an ICA of their
    # own, where the narrow band is the analysis. Every band here redraws one and the
    # same broadband decomposition, so a second band buys a second copy of each
    # component's topography and a rescaled copy of its spectrum, and only the
    # time-frequency panel differs.
    #
    # One band by default. The five that this replaced were nested — delta+theta, alpha
    # and beta all sit inside broadband 1-30 — so three of the five sections were a zoom
    # on a fourth, and together they were 49 MB of a 79 MB report.
    #
    # Every fitted component keeps a dossier whatever this is set to. The list controls
    # how many times each component is drawn, never which components are drawn: ICLabel
    # is wrong in both directions, and a report that showed only the components it
    # flagged could not be used to find the ones it missed.
    #
    # Uncomment to split the axis again; fmax must stay below Nyquist.
    # review_bands:
    #   - {slug: low,  title: "Low (1–30 Hz)",    fmin: 1.0,  fmax: 30.0}
    #   - {slug: high, title: "High (30–100 Hz)", fmin: 30.0, fmax: 100.0}
    tfr:
      # Event-locked, baseline-relative time-frequency power for each component.
      # Set false for resting-state or any continuous recording: fixed-length epochs
      # have no event and no pre-stimulus interval, so there is no baseline for the
      # power to be relative to. The component dossiers then show topography and
      # Welch spectrum only, which is the interpretable evidence for rest.
      enabled: true
      frequency_step_hz: 1.0
      time_min_s: -5.0
      time_max_s: 14.4
      time_step_s: 0.1
      baseline_tmin_s: -5.0
      # The DPSS tapers are centred and up to 3 s wide, so a baseline ending nearer
      # than 1.5 s to the event estimates "pre-stimulus" power partly from
      # post-stimulus data. The leak scales with each condition's own response, so it
      # biases condition differences instead of cancelling in them.
      baseline_tmax_s: -1.5
    comparisons:
      - name: max_vs_low_temp
        column: stimulus_temp
        group_a:
          label: Max Temp
          values: [48.3, 49.3]
        group_b:
          label: Low Temp
          values: [44.3, 45.3]

epochs:
  # STUDY-SPECIFIC. These bounds are sized for a slow thermal response and are unusually
  # long; most paradigms want a fraction of this. Review before trusting any output.
  #
  # IMPORTANT: Keep epochs.tmin earlier than the earliest baseline time window.
  # With Morlet wavelets and low frequencies (e.g., 1 Hz with min_cycles=3),
  # baseline values near the epoch boundary are edge-affected and can bias
  # baseline-normalized power. This extra padding reduces that bias.
  tmin: -7.0
  tmax: 15.0
  # Use an ERP-appropriate baseline window. Per-feature baseline handling is preferable,
  # but when a global epoch baseline is applied, it should match the ERP convention.
  baseline: [-0.2, 0.0]
  # For long stimulus-locked epochs (-5..15s), fixed PTP thresholds are brittle and can
  # reject nearly all trials due to slow drift/residual artifacts. Prefer autoreject.
  reject: "autoreject_local"
  autoreject_n_interpolate: [4, 8, 16]

###################################################################
# 4. ANALYSIS PARAMETERS
###################################################################

analysis:
  # Minimum subject count used by pipelines that operate at group scope.
  min_subjects_for_group: 2
  strict_mode: true


# 4.2 Time-Frequency (TFR)
time_frequency_analysis:
  baseline_mode: "logratio"
  baseline_window: *baseline_window_tfr_morlet  # Morlet taper, see time_windows
  active_window: *active_window
  # Optional restriction for plotting/exports (null = use all configured bands).
  selected_bands: null
  bands: *frequency_bands
  tfr:
    freq_min: 1.0
    freq_max: 100.0
    n_freqs: 40
    min_cycles: 3.0
    max_cycles: 15.0            # Cap to avoid extreme smoothing at high frequencies (gamma)
    n_cycles_factor: 2.0         # n_cycles = freq / n_cycles_factor
    decim_power: 4               # Decimation for power TFR (can be aggressive)
    decim_phase: 1               # Decimation for phase/complex TFR (preserve time structure)
    workers: -1
  rois: *roi_definitions
  
  topomap:
    temporal:
      single_subject:
        hspace: 0.15
        wspace: 0.8
      window_size_ms: 100.0  # Size of each time window in milliseconds (for fixed-size windows)
  
  constants:
    # Only keys read by the pipeline belong here. A guard that nothing enforces is
    # worse than no guard, because it reads as a safeguard while changing nothing.
    baseline_sentinel: "BASELINED:"
    min_samples_for_baseline_validation: 10

# 4.1b Subject HTML Report
#
# These settings control what the report flags and how its figures are scaled. They do
# not change any derivative: turning a threshold up or down alters the warnings a
# reviewer sees, never the data. Sections whose inputs are absent are omitted rather
# than rendered empty, so a recording with no ECG lead simply has no cardiac-rhythm
# section and a resting-state run has no per-condition retention panel.
report:
  enabled: true
  thresholds:
    # Reference line drawn on the region-coverage figure, and the count below which a
    # region is listed in the coverage text. Interpreting the shortfall is left to the
    # reviewer.
    min_roi_channels: 2
    # Reference value for samples per squared component, shown beside the measured
    # value in the decomposition table (Onton and Makeig suggest 20 to 30).
    min_samples_per_squared_component: 20.0
    # Variance share used to split the excluded components into two groups in the
    # decomposition text, so the rank spent on small components is visible.
    low_variance_exclusion_floor: 0.01
    # Distinct values above which an events column is treated as continuous and not
    # reported as a retention grouping.
    max_group_levels: 12
    # Runs needed before a quantile band is drawn across runs; below this a band would
    # only redraw the min-max envelope.
    min_runs_for_quantile_band: 5
    # Physiologically possible heart rate. One statement, two readers: the subject
    # tachogram shades the interval range it implies and the cohort panel counts
    # participants whose median falls outside it. Neither rejects anybody — the count is
    # the measurement and what it means is the reviewer's call. 30–220 bpm covers an
    # adult at rest through an adult under load; a developmental or paediatric cohort
    # sits higher and should say so here.
    plausible_heart_rate_bpm: [30.0, 220.0]
    # Distance within which a beat marker and an ECG-detected R peak are taken to be the
    # same beat. Two detectors pick different samples of the same beat and routinely
    # differ by tens of milliseconds. Must stay below half the shortest interval the
    # heart rate above allows, or a marker can match the beat after the one it belongs
    # to and report agreement the detectors never had.
    marker_agreement_tolerance_s: 0.1
    # Half-width of the band a notch filter is treated as having removed, in hertz.
    # Every measurement that reads power at a frequency uses it to tell filter from
    # data: the aperiodic fit excludes it, the spectral axis ignores it, and a marked
    # frequency landing inside it is drawn but not scored. Sized for the FIR notch this
    # pipeline applies (0.97 Hz wide); a wider filter, or a different line-removal
    # method, owns a different span of bins.
    notch_exclusion_half_width_hz: 2.0
    # Electrode positions within this of each other are the same site on the head.
    # Positions come from digitisation or a montage lookup, so nominally identical
    # electrodes differ by rounding rather than by millimetres.
    channel_position_tolerance_m: 0.005
    # Participants required before a cohort panel draws a median and interquartile band,
    # and before it additionally draws the 10th-to-90th band. Distinct from
    # min_runs_for_quantile_band above, which gates a band over one participant's runs.
    # Neither may be set low enough to extrapolate a quantile beyond the participants
    # actually observed; a value that would is rejected rather than drawn. The cohort
    # command's --min-subjects-* flags override these for a one-off run.
    min_subjects_for_median: 5
    min_subjects_for_outer_band: 10
  display:
    # Raster panels (dense heatmaps and MNE figure sliders) are embedded at this
    # resolution and maximum width. Line plots remain SVG and therefore stay sharp at
    # any zoom. MNE's defaults are 100 dpi and 850 px; these higher limits keep labels
    # and sensor names legible on high-density displays and in print.
    figure_dpi: 200
    figure_max_width_px: 2000
    # Fixed number of scalp maps sampled uniformly across response_window_s. Times are
    # never selected from observed peaks, which would make the QC display participant-
    # dependent and bias visual review toward each participant's largest fluctuation.
    evoked_topomap_count: 4
    # Percentile of absolute values defining symmetric colour limits, so that one
    # extreme component cannot flatten every other to the neutral colour.
    color_limit_percentile: 98.0
    # Columns in the all-components contact sheet.
    component_overview_columns: 8
    # Line-noise fundamental marked on the sensor spectra, with its harmonics. Leave
    # unset to inherit preprocessing.notch_freq; set to null to mark nothing.
    # spectra_line_frequency: 60.0
    # Extra frequencies to mark on the sensor spectra, for example the centres of a
    # known interference comb. Marks are reference lines only; the report draws no
    # conclusion from what appears at them. Keep the list short: tens of vertical lines
    # would bury the spectrum this axis exists to show.
    spectra_marked_frequencies: []
    # Upper edge of the sensor-spectra axis. Above the low-pass the filter, not the
    # recording, sets the trace, so leave unset to inherit preprocessing.h_freq. Set a
    # number only to override; setting it above the low-pass plots roll-off as data.
    # spectra_fmax: 100.0
    # Window over which time-resolved amplitude is pooled in the "Data quality over
    # time" section, in seconds. Short enough to localise a movement to a few seconds,
    # long enough that a single window's RMS is a stable estimate.
    continuity_window_seconds: 1.0
  analysis:
    # MNE recommends approximately three minutes from the end of a recording for bridge
    # screening because gel can settle over time. This fixed duration is used for every
    # run; shorter runs contribute their full duration.
    bridge_diagnostic_duration_s: 180.0
    # Frequency interval used for the robust log-log aperiodic fit. Keep its upper edge
    # below line noise so the notch and its skirts cannot determine the slope.
    aperiodic_fit_range_hz: [2.0, 45.0]
    # Frequency windows withheld from the aperiodic fit, beyond the notch stopbands and
    # anything a decomb manifest reports as unavailable. For a persistent narrowband
    # feature that is instrumental rather than neural -- an equipment line, a residual
    # comb -- which a robust fit would otherwise tilt toward. Empty by default: a fit
    # should sit on the data unless there is a named reason it cannot.
    aperiodic_exclude_hz: []
    # Interval used for split-half evoked reliability. This task delivers heat from
    # 3–10.5 s; scoring 0–1 s would measure the pre-stimulation wait and could call a
    # sound pain response absent.
    response_window_s: *active_window
    # Posterior rhythm band used as signal-preservation evidence.
    alpha_band_hz: [7.0, 14.0]
    # Neighbourhood the posterior rhythm is scored against. The prominence is the peak's
    # excess over a background fitted outside the band, so this must surround
    # alpha_band_hz and moves with it: a band shifted down for a developmental cohort
    # needs its reference window shifted too, or the peak is scored against a background
    # fitted where the peak now is.
    alpha_reference_band_hz: [3.0, 25.0]
    # MNE's continuous muscle-artifact score. The documented 110–140 Hz example band
    # is unavailable after this pipeline's 100 Hz low-pass, so use the highest clean
    # interval below it while avoiding the 60 Hz notch. This is diagnostic only: the
    # returned BAD_muscle annotations are shown in the report but never applied.
    # Set the band to null only when the acquisition's sampling rate or low-pass cannot
    # support it; an incompatible non-null band fails instead of silently changing.
    muscle_filter_freq_hz: [70.0, 90.0]
    muscle_zscore_threshold: 4.0
    muscle_min_length_good_s: 0.1
  acquisition:
    # Electrode names eligible for the posterior-rhythm measurement.
    posterior_channel_pattern: '^(P[0-9z]|PO[0-9z]|O[0-9z]|Oz|POz|Pz)'
    # Annotation prefixes that are not task events, so the event rug under the "Data
    # quality over time" trace counts trials rather than the acquisition's bookkeeping.
    # Matched case-insensitively against the start of each annotation.
    #
    # The default names only what this pipeline and MNE write for themselves. The beat
    # marker description above is excluded automatically and needs no entry.
    # Add whatever else your acquisition writes that is not a trial — a stimulus-computer
    # heartbeat, an acquisition trigger spelled its own way, a response marker in a paradigm
    # where the response is not the event. Do NOT add a prefix your trials start with:
    # the rug would then report zero events on a run full of them.
    non_event_prefixes: ["BAD", "EDGE", "NEW SEGMENT"]
    # Detector prose mapped to the class a cohort counts an excluded ICA component
    # under, matched lowercase as a substring of the detector's status description.
    #
    # Order decides which of two overlapping patterns wins, so it is preserved as
    # written: "channel noise" must precede anything matching bare "noise". A
    # description no pattern matches is counted under "other" rather than dropped, so a
    # site whose detectors write different prose gets a cohort where every exclusion is
    # unclassified rather than one that is wrong — set your own patterns instead.
    # Classes: eye, heart, muscle, line, channel.
    component_label_patterns:
      - ["eye blink", "eye"]
      - ["eog", "eye"]
      - ["ocular", "eye"]
      - ["heart beat", "heart"]
      - ["ecg", "heart"]
      - ["cardiac", "heart"]
      - ["muscle", "muscle"]
      - ["line noise", "line"]
      - ["channel noise", "channel"]

# 4.2a ICA Component Time-Frequency Analysis
component_time_frequency:
  condition_column: "stimulus_temp"
  # A condition average computed from one or two trials is not an average: the
  # log-ratio baseline is unstable and the resulting TFR is one trial's noise. Ten is
  # the conventional floor for a per-condition time-frequency estimate.
  minimum_epochs_per_condition: 10
  n_jobs: 1
  ica:
    band: [6.0, 14.0]
    fit_window: *active_window
    max_iterations: 2000
    random_state: 42
  tfr:
    frequency_range: [1.0, 30.0]
    frequency_step: 1.0
    window_duration: 1.0
    frequency_smoothing: 2.0
    time_step: 0.1
    baseline_window: *baseline_window_tfr_multitaper  # 1.0 s multitaper window
    baseline_mode: "logratio"
  plotting:
    components_per_page: 6

power:
  bands_to_use: ["delta", "theta", "alpha", "beta", "gamma"]

# 4.3 Feature Extraction
feature_engineering:
  task_is_rest: false
  feature_categories: ["power", "connectivity", "aperiodic", "itpc", "pac", "complexity", "quality", "microstates", "erds", "spectral", "ratios", "asymmetry", "erp", "bursts"]
  spatial_modes: ["roi", "channels", "global"]
  # Controls cross-trial feature computation and leakage constraints:
  # - "group_stats": allow cross-trial estimates (one row per subject/condition as appropriate)
  # - "trial_ml_safe": forbid cross-trial features unless train_mask is provided (ML/CV-safe)
  analysis_mode: "group_stats"

  # Per-family spatial transforms: CSD is excellent for phase connectivity but changes
  # the meaning/units/topography of amplitude-derived features. Configure separately.
  # Options: "csd" (recommended for phase), "laplacian", or "none"
  spatial_transform_per_family:
    connectivity: "csd"      # Phase-based connectivity REQUIRES CSD for valid results
    itpc: "csd"              # Phase coherence also benefits from CSD
    pac: "csd"               # PAC phase component benefits from CSD
    power: "none"            # Amplitude features - CSD changes interpretation
    # Kept "none" deliberately, and CSD is NOT added here as a sibling key: this map is
    # consulted by family name from feature_categories above, so an invented key such as
    # "power_csd" would be read by nothing. Scalp muscle spreads far from its generators
    # and a pain-minus-warm gamma change tracks each channel's muscle index across
    # channels in 12 of 14 participants (median r = +0.34 / +0.28 / +0.19 for
    # 30.1-45 / 45-58 / 62-95 Hz), which is what CSD would be for. Whether it helps here
    # is measured by studies/pain_study/scripts/csd_muscle_check.py. Wiring CSD in as a
    # first-class feature family is deferred until that measurement says it is worth it.
    aperiodic: "none"        # Slope/offset - CSD changes spectral shape
    bursts: "none"           # Envelope-based - CSD changes amplitude
    erds: "none"             # Baseline-normalized power - CSD changes baseline
    complexity: "none"       # Nonlinear dynamics - CSD changes signal properties
    ratios: "none"           # Band ratios - CSD changes band power
    asymmetry: "none"        # Hemispheric asymmetry - CSD changes topography
    spectral: "none"         # Peak frequency etc - CSD changes spectral shape
    erp: "none"              # ERP waveforms - CSD changes amplitude/topography
    quality: "none"          # Quality metrics - should match raw data
    microstates: "none"      # Topographic maps; keep voltage-space interpretation
  spatial_transform_params:
    lambda2: 1.0e-5
    stiffness: 4.0
  # Global spatial transform override:
  # - "none": use per-family spatial_transform_per_family settings (recommended)
  # - "csd"/"laplacian": force this transform for ALL families (use with care)
  spatial_transform: "none"

  # Parallelization (per-module; -1 = all cores)
  parallel:
    n_jobs_bands: -1
    n_jobs_connectivity: -1
    n_jobs_itpc: -1
    n_jobs_aperiodic: -1
    n_jobs_complexity: -1

  # Shared intermediates
  precomputed:
    subtract_evoked: null  # null = inherit feature_engineering.power.subtract_evoked

  # Optional storage/extra outputs
  save_tfr_with_sidecar: false
  compute_change_scores: true
  change_scores:
    transform: "difference"          # "difference" | "percent" | "log_ratio"
    window_pairs:
      - ["baseline", "active"]

  power:
    require_baseline: true
    # For event-related pain paradigms, subtracting the evoked (ERP) component is often
    # scientifically preferable when interpreting oscillatory power changes as "induced".
    # In trial_ml_safe mode, provide ctx.train_mask to avoid CV leakage; otherwise this
    # is automatically disabled for safety.
    subtract_evoked: true
    min_trials_per_condition: 2
    # Line-noise control for TFR band-averaged power (independent of notch quality).
    # Defaults fall back to feature_engineering.spectral.* if unset.
    exclude_line_noise: true
    line_noise_freqs: [60.0]
    line_noise_width_hz: 1.0
    line_noise_harmonics: 3
    # Emit dB-scaled versions of log10-ratio power:
    #   db = 10 * log10(active / baseline)
    emit_db: true
  
  constants:
    epsilon_std: *epsilon_std
    epsilon_psd: *epsilon_psd
    epsilon_amp: *epsilon_amp
    min_epochs_for_features: 10
    min_channels_for_connectivity: 3
    min_samples_for_psd: 64
    min_valid_fraction: 0.5
    min_epochs_for_plv: 10
    min_edge_samples: 30
  
  # Feature validity thresholds shared across families
  features:
    min_baseline_power: 1.0e-12      # Clamp baseline power to avoid division instability
    min_valid_band_fraction: 0.0     # 0 disables trial dropping based on valid-band coverage

  # Welch PSD settings for shared PSD helpers.
  # null n_fft/n_overlap uses data-length-aware defaults.
  psd:
    fmin: 1.0
    fmax: 80.0
    n_fft: null
    n_overlap: null
    window: "hann"
    n_jobs: 1

  spectral:
    ratio_pairs:
      - [theta, beta]       
      - [theta, alpha]    
      - [alpha, beta]     
      - [delta, alpha]     
      - [delta, theta]      
    include_log_ratios: true
    # NOTE: Band ratios in this pipeline use PSD-integrated band power (power per Hz),
    # which is appropriate for cross-band ratios. For aperiodic-adjusted ratios,
    # use `*_powcorr` outputs from the aperiodic module.
    psd_method: "multitaper"         # "multitaper" (recommended) or "welch"
    psd_adaptive: false
    multitaper_adaptive: false
    fmin: 1.0
    fmax: 80.0
    exclude_line_noise: true
    line_noise_freqs: [60.0]         # Must match preprocessing.line_freq
    line_noise_width_hz: 1.0
    line_noise_harmonics: 3
    min_segment_sec: 2.0             # Minimum segment duration for reliable PSD (sec)
    min_cycles_at_fmin: 3.0          # Require at least this many cycles at lowest freq in band

  band_envelope:
    # Padding reduces edge artifacts for bandpass+Hilbert envelopes/phases on epoched data.
    # Effective padding is max(pad_sec, pad_cycles / fmin).
    pad_sec: 0.5
    pad_cycles: 3.0

  # Optional individualized bands (IAF-based) derived from baseline PSD.
  bands:
    use_iaf: false
    alpha_width_hz: 2.0
    iaf_search_range_hz: [7.0, 13.0]
    iaf_min_prominence: 0.05
    iaf_min_cycles_at_fmin: 5.0     # Require this many cycles at iaf_search_range_hz[0] for stable PSD/peak detection
    iaf_min_baseline_sec: 0.0       # Additional absolute minimum baseline duration (sec); 0 disables
    allow_full_fallback: false      # If true and baseline is missing, use full segment (not recommended for pain paradigms)
    # Use existing ROI names from `rois:` above. If these ROIs are missing, IAF
    # estimation returns null unless allow_all_channels_fallback=true.
    iaf_rois: ["ParOccipital_Midline", "ParOccipital_Left", "ParOccipital_Right"]
    allow_all_channels_fallback: false

  itpc:
    # Leakage-safe modes:
    # - "fold_global": ITPC computed from TRAINING trials only when ctx.train_mask present (CV-safe, DEFAULT)
    # - "global": ITPC computed across ALL trials and broadcast per trial (LEAKS in CV/ML - use only for descriptive analysis)
    # - "condition": ITPC computed per condition group (avoids pseudo-replication for condition-level analyses)
    # - "loo": Leave-one-out ITPC (unsafe unless allow_unsafe_loo=true and computed in-fold)
    method: "fold_global"
    allow_unsafe_loo: false
    baseline_correction: "none"  # "none" or "subtract"
    # Condition-based ITPC settings (used when method="condition")
    # ITPC is fundamentally cross-trial; broadcasting it per trial creates pseudo-replication.
    # For condition-level analyses, compute ITPC within each condition group.
    condition_column: null        # Column name in events for condition grouping (e.g., "condition", "stimulus_type")
    condition_values: []          # Optional: values to INCLUDE (empty = all). Other values are excluded (rows set to NaN).
    min_trials_per_condition: 10  # Minimum trials per condition for reliable ITPC
    min_segment_sec: 1.0          # Minimum segment duration for ITPC (sec)
    min_cycles_at_fmin: 3.0       # Require at least this many cycles at lowest freq in band

  ratios:
    min_segment_sec: 1.0          # Minimum segment duration for band ratios (sec)
    min_cycles_at_fmin: 3.0       # Require at least this many cycles at lowest freq in band
    skip_invalid_segments: true   # Skip segments that don't meet validity criteria (vs NaN)

  asymmetry:
    channel_pairs:
      - ["F3", "F4"]
      - ["F7", "F8"]
      - ["C3", "C4"]
      - ["P3", "P4"]
      - ["O1", "O2"]
    min_segment_sec: 1.0          # Minimum segment duration for asymmetry (sec)
    min_cycles_at_fmin: 3.0       # Require at least this many cycles at lowest freq in band
    skip_invalid_segments: true   # Skip segments that don't meet validity criteria (vs NaN)
    emit_activation_convention: false  # Also emit (R-L)/(R+L) activation-style asymmetry for activation_bands
    activation_bands: ["alpha"]

  aperiodic:
    model: "fixed"                 # "fixed" or "knee"
    psd_method: "multitaper"       # "multitaper" (recommended) or "welch"
    psd_bandwidth: null
    multitaper_adaptive: false
    subtract_evoked: false         # Induced spectra (evoked subtraction; CV-safe only with train_mask)
    fmin: 1.0                      # Must cover lowest band (delta starts at 1.0 Hz)
    fmax: 80.0                     # Must cover highest band (gamma ends at 80.0 Hz)
    peak_rejection_z: 3.5
    min_r2: 0.6
    min_fit_points: 5
    max_rms: null
    min_segment_sec: 2.0           # Minimum segment duration for stable slope/offset estimation (sec)
    max_freq_resolution_hz: 1.0    # Skip segments if PSD frequency step is coarser than this
    exclude_line_noise: true       # Exclude line-noise bins before fitting
    line_noise_freqs: [60.0]       # Must match preprocessing.line_freq
    line_noise_width_hz: 1.0
    line_noise_harmonics: 3

  connectivity:
    measures: ["wpli", "aec"]
    output_level: "full"              # "full" or "global_only"
    mode: "cwt_morlet"                # mne-connectivity mode for phase measures
    aec_mode: "orth"
    aec_absolute: true
    aec_output: ["r"]                 # ["r"] (raw), ["z"] (Fisher-z), or ["r", "z"] (both); z averages correctly across trials/subjects
    enable_aec: true
    enable_graph_metrics: false
    graph_top_prop: 0.1
    small_world_n_rand: 100
    sliding_window_len: 1.0
    sliding_window_step: 0.5
    dynamic_enabled: false
    dynamic_measures: ["wpli", "aec"]   # Sliding-window dynamic metrics per edge/ROI
    dynamic_autocorr_lag: 1             # Lag (in windows) for temporal autocorrelation
    dynamic_min_windows: 3              # Minimum windows required to emit dynamic features
    dynamic_include_roi_pairs: true     # Also emit ROI-pair summaries (mean/std/autocorr)
    dynamic_state_enabled: true         # K-means connectivity state transitions
    dynamic_state_n_states: 3           # Number of connectivity states
    dynamic_state_min_windows: 8        # Minimum windows required for state metrics
    dynamic_state_random_state: null    # Optional seed for deterministic state clustering
    n_freqs_per_band: 8
    n_cycles: null
    decim: 1
    min_segment_samples: 50
    granularity: "trial"             # "trial", "condition", "subject"
    condition_column: null            # When granularity="condition": events.tsv column defining condition groups (null = auto-detect)
    condition_values: []              # Optional: values to INCLUDE. If set, other values are excluded (rows set to NaN).
    min_epochs_per_group: 5
    min_cycles_per_band: 3.0         # Minimum oscillatory cycles per band for reliable connectivity
    warn_if_no_spatial_transform: true  # Warn if phase-based measures used without CSD/Laplacian
    phase_estimator: "within_epoch"  # "within_epoch" (per-trial) or "across_epochs" (group-level, broadcast)
    force_within_epoch_for_ml: true  # Force within_epoch when train_mask detected (prevents CV leakage)
    min_segment_sec: 1.0             # Minimum segment duration for connectivity (sec)

  directedconnectivity:
    enable_psi: true
    enable_dtf: false
    enable_pdc: false
    output_level: "full"     # "full" | "global_only"
    mvar_order: 10
    min_samples_per_mvar_parameter: 10  # Auto-reduce order when short windows cannot support stable fits
    n_freqs: 16
    min_segment_samples: 100

  # Source localization (MNE-Python): cortical ROI power/envelope/connectivity from source estimates.
  #
  # Defaults use the FreeSurfer fsaverage template. For subject-specific (or fMRI-informed) localization,
  # you MUST provide:
  #   - subjects_dir: FreeSurfer SUBJECTS_DIR (folder containing the subject directory)
  #   - subject: FreeSurfer subject name (e.g., "sub-0001")
  #   - trans: EEG↔MRI transform file (*.fif) from MNE coregistration
  #   - bem: BEM solution file (*-bem-sol.fif)
  #
  # fMRI-informed mode does NOT use raw BOLD time-series directly. It requires an fMRI statistical map
  # (t/z/cope/contrast map) already computed by an fMRI GLM and resampled into the SAME MRI space as the
  # FreeSurfer subject (typically `mri/orig.mgz` space).
  #
  sourcelocalization:
    mode: "eeg_only"                    # "eeg_only" (template-based) or "fmri_informed" (subject-specific)
    allow_template_fallback: false
    method: "lcmv"                 # "lcmv" or "eloreta"
    spacing: "oct6"                # "oct5" | "oct6" | "ico4" | "ico5"
    parcellation: "aparc"          # "aparc" | "aparc.a2009s" | "HCPMMP1"
    connectivity_method: "aec"     # "aec" | "wpli" | "plv"
    # Validity gate used by EEG source connectivity checks (min cycles at band fmin).
    min_cycles_per_band: 3.0
    mindist_mm: 5.0
    reg: 0.05                      # LCMV regularization
    snr: 3.0                       # eLORETA SNR
    loose: 0.2                     # eLORETA loose orientation (0..1)
    depth: 0.8                     # eLORETA depth weighting (0..1)
    subjects_dir: null             # e.g., "../../data/freesurfer"
    subject: null                  # e.g., "sub-0001"
    trans: null                    # e.g., "../../../data/derivatives/coreg/sub-0001-trans.fif"
    bem: null                      # e.g., "../../../data/derivatives/bem/sub-0001-bem-sol.fif"
    save_stc: false
    fmri:
      enabled: false
      stats_map_path: null         # NIfTI statistical map in the subject's FreeSurfer MRI space (e.g., orig.mgz space)
      provenance: "independent"    # "independent" (recommended) or "same_dataset" (circularity risk)
      require_provenance: true     # If true, error when provenance is unknown
      allow_same_dataset_provenance: false
      threshold: 3.1
      thresholding:
        mode: "z"                  # "z" or "fdr"
        fdr_q: 0.05
        stat_type: "z"
      tail: "pos"                  # "pos" or "abs"
      cluster_min_voxels: 50
      # Preferred: stable across voxel sizes/resampling. When set, overrides cluster_min_voxels.
      # Example: 50 vox @ 2mm isotropic ≈ 50 * 8 = 400 mm^3.
      cluster_min_volume_mm3: 400
      max_clusters: 20
      max_voxels_per_cluster: 2000
      max_total_voxels: 20000
      random_seed: 0
      output_space: "dual"         # "cluster" | "atlas" | "dual"
      # NOTE: fmri.time_windows is intentionally unsupported for source feature computation.
      contrast:
        enabled: false
        type: "t-test"             # "t-test" | "custom"
        condition_a: {column: "trial_type", value: ""}
        condition_b: {column: "trial_type", value: ""}
        formula: ""
        name: "pain_vs_baseline"
        runs: []                   # explicit runs (empty = auto-detect)
        hrf_model: "spm"           # "spm" | "flobs" | "fir"
        drift_model: "cosine"      # "none" | "cosine" | "polynomial"
        high_pass_hz: 0.008
        low_pass_hz: null          # Optional; avoid unless you know you need it
        # Optional: restrict which event phases are modeled by the GLM (by events.tsv trial_type).
        # If null, all event rows are modeled (default). For multi-phase pain tasks, a practical choice is:
        #   ["stimulation", "pain_question", "vas_rating"]
        events_to_model: null
        events_to_model_column: "trial_type"
        # Optional: restrict which stimulation sub-phases are modeled using the configured phase column.
        # If set, that phase column must exist in events.tsv.
        # If null, no stim_phase scoping is applied.
        # Use ["all"] to disable scoping and model all stimulation phases.
        stim_phases_to_model: null
        output_type: "z-score"     # "z-score" | "t-stat" | "cope" | "beta"
        resample_to_freesurfer: true

    # Plotting-only contrast labels (used to build condition contrasts from precomputed STCs).
    contrast:
      enabled: false
      condition_column: ""
      condition_a: ""
      condition_b: ""
      min_trials_per_condition: 5
      emit_welch_stats: false

  pac:
    source: "precomputed"        # "precomputed" (Hilbert PAC, recommended) or "tfr" (wavelet PAC, prone to spurious coupling)
    method: "mvl"
    surrogate_method: "trial_shuffle"  # "trial_shuffle" (recommended) | "circular_shift"
    pairs: [["theta", "gamma"], ["alpha", "gamma"]]
    phase_range: [4.0, 8.0]
    amp_range: [30.0, 80.0]
    min_epochs: 2
    min_segment_sec: 1.0
    min_cycles_at_fmin: 3.0
    normalize: true
    n_surrogates: 200
    random_seed: 42
    allow_harmonic_overlap: false
    max_harmonic: 6
    harmonic_tolerance_hz: 1.0
    # Emits low-frequency waveform non-sinusoidality diagnostics alongside PAC.
    # Useful for spotting spurious PAC driven by sharp transients/non-sinusoidal waveforms.
    compute_waveform_qc: true
    waveform_offset_ms: 5.0

  complexity:
    # Complexity can be computed on either the band-passed signal ("filtered") or its envelope.
    # "filtered" is more interpretable as oscillatory complexity; "envelope" targets amplitude dynamics.
    signal_basis: "filtered"         # "filtered" | "envelope"
    pe_order: 3
    pe_delay: 1
    sampen_order: 2                  # Sample entropy embedding dimension
    sampen_r: 0.2                    # Sample entropy tolerance as fraction of SD
    mse_scale_min: 1                 # MSE coarse-graining start scale
    mse_scale_max: 20                # MSE coarse-graining end scale
    zscore: true
    min_segment_sec: 2.0             # Minimum segment duration (sec)
    min_samples: 200                 # Minimum samples for stable LZC/PE/SampEn/MSE
    skip_invalid_segments: true

  output:
    also_save_csv: false

  erp:
    baseline_correction: true
    # Baseline window (seconds) for ERP plotting and baseline correction.
    baseline_window: [-0.2, 0.0]
    allow_no_baseline: false
    smooth_ms: 0.0
    peak_prominence_uv: null
    lowpass_hz: 30.0                 # Low-pass filter before ERP peak detection (standard practice)
    components:
      - name: "n1"
        start: 0.10
        end: 0.20
      - name: "n2"
        start: 0.20
        end: 0.35
      - name: "p2"
        start: 0.35
        end: 0.50

  bursts:
    bands: ["beta", "gamma"]
    threshold_method: "percentile"   # "percentile", "zscore", "mad"
    threshold_reference: "trial"     # "trial" (trialwise-valid), "subject" (cross-trial), or "condition" (cross-trial within condition)
    threshold_percentile: 95.0
    threshold_z: 2.0                # used for zscore/mad methods
    min_trials_per_condition: 10     # used when threshold_reference="condition"
    min_segment_sec: 2.0             # Minimum segment duration (sec) before attempting bursts
    skip_invalid_segments: true
    min_duration_ms: 50
    min_cycles: 3.0

  erds:
    use_log_ratio: false             # true = dB (10*log10), false = percent change
    min_baseline_power: 1.0e-12      # Clamp baseline power to avoid division instability
    min_active_power: 1.0e-12        # Clamp active power for log computation
    min_segment_sec: 0.5             # Minimum segment duration in seconds
    bands: ["alpha", "beta"]         # Bands for ERDS computation (subset of frequency_bands)
    enable_laterality_markers: false
    laterality_marker_identifier: "Somatosensory_Contralateral"
    laterality_marker_bands: ["alpha"]  # Bands where contralateral pain markers are extracted
    laterality_columns: ["stim_side", "stimulated_side", "pain_side", "side", "stimulus_side", "hand"]
    infer_contralateral_when_missing: true
    somatosensory_left_channels: ["C1", "C3", "C5", "CP1", "CP3", "CP5", "FC1", "FC3", "FC5"]
    somatosensory_right_channels: ["C2", "C4", "C6", "CP2", "CP4", "CP6", "FC2", "FC4", "FC6"]
    onset_threshold_sigma: 1.0       # Threshold crossing = sigma * baseline noise (%), with floor below
    onset_min_threshold_percent: 5.0 # Absolute minimum threshold for ERD onset (%)
    onset_min_duration_ms: 30.0      # Sustained crossing duration for onset detection
    rebound_threshold_sigma: 1.0     # Rebound threshold = sigma * baseline noise (%), with floor below
    rebound_min_threshold_percent: 5.0
    rebound_min_latency_ms: 100.0    # Search rebound after this delay from ERD peak

  quality:
    psd_method: "welch"              # "welch" or "multitaper"
    fmin: 1.0
    fmax: 100.0
    n_fft: 256
    exclude_line_noise: true
    line_noise_freqs: [60.0]         # Must match preprocessing.line_freq
    line_noise_width_hz: 1.0
    line_noise_harmonics: 3
    snr_signal_band: [1.0, 30.0]     # "Signal" band for SNR computation
    snr_noise_band: [40.0, 80.0]     # "Noise" band for SNR computation
    muscle_band: [30.0, 80.0]        # High-frequency band for muscle artifact detection

  microstates:
    n_states: 4
    min_peak_distance_ms: 10.0
    max_gfp_peaks_per_epoch: 400
    min_duration_ms: 20.0
    assign_from_gfp_peaks: true   # If true, assign states at GFP peaks then backfit sample-wise labels
    gfp_peak_prominence: 0.0
    random_state: 42

# 4.5 Machine Learning
machine_learning:
  # Data loading for ML:
  # - Feature tables come from the feature extraction pipeline (derivatives/.../eeg/features/*/features_*.parquet)
  # - Targets/covariates come from the *clean* events.tsv (derivatives/.../eeg/*_proc-clean_events.tsv when available)
  data:
    feature_set: "combined"              # "combined" | "power" | "connectivity" | "aperiodic" | "itpc" | "erp" | "channels_mean"
    feature_families: null               # Used when feature_set="combined" (null = load all standard families; override via CLI: --feature-families ...)
    feature_bands: null                  # Optional restriction (NamingSchema band), e.g. ["alpha", "beta"]
    feature_segments: null               # Optional restriction (NamingSchema segment), e.g. ["baseline", "active"]
    feature_scopes: null                 # Optional restriction (NamingSchema scope), e.g. ["global", "roi", "chpair"]
    feature_stats: null                  # Optional restriction (NamingSchema stat), e.g. ["wpli", "aec"] for connectivity
    feature_harmonization: "intersection"  # "intersection" | "union_impute"
    feature_files: {}                    # Optional overrides per family: { power: "features_power.parquet", ... }
    covariates: []                       # Optional extra predictors appended to X (meta names: temperature, trial_index, block, ...)
    covariates_strict: true              # If true, error when requested covariates are missing
    require_trial_ml_safe: true          # If true, error unless feature_engineering.analysis_mode="trial_ml_safe"
    max_excluded_subject_fraction: 0.25  # Fail ML matrix build if excluded subjects exceed this fraction of requested subjects

  # Targets can be logical names ('outcome', 'predictor', 'binary_outcome') or explicit events.tsv column names.
  targets:
    regression: "outcome"
    classification: "binary_outcome"
    binary_threshold: null               # Required when classifying a continuous target (e.g., rating > 30)
    strict_regression_target_continuous: false  # If true, error when regression target is binary-like (prefer ml classify)

  incremental_validity:
    baseline_predictors: []              # required; standardized meta names: predictor, trial_index, run
    require_baseline_predictors: true    # If true, missing baseline predictors raise an error instead of intercept-only fallback
    baseline_alpha: 1.0

  cv:
    inner_splits: 5
    outer_splits: 5
    hygiene_enabled: true
    within_subject_ordered_runs: false  # If true, within-subject CV uses forward run splits when run labels are explicitly ordered.
    permutation_scheme: "within_subject"  # "within_subject" | "within_subject_within_run"
    min_label_shuffle_fraction: 0.01     # Minimum fraction of labels that must change for a permutation to be considered effective
    min_valid_permutation_fraction: 0.5  # Minimum completed/requested permutations required for valid p-values
    min_valid_permutation_fold_fraction: 1.0
    default_n_splits: 5
    default_n_bins: 5

  evaluation:
    ci_method: "bootstrap"               # "fixed_effects" | "bootstrap"
    bootstrap_iterations: 1000
    subject_weighting: "equal"           # "equal" (recommended inferential unit = subject) | "trial_count"

  constants:
    variance_threshold: 0.0

  preprocessing:
    imputer_strategy: "median"
    variance_threshold_grid: [0.0, 0.01, 0.1]
    power_transformer_method: "yeo-johnson"
    power_transformer_standardize: true
    deconfound: false                      # Regress covariates out of EEG features before classification
    spatial_regions_allowed: []            # List of ROI names to keep (e.g., ["frontal", "parietal"]); empty = all
    feature_selection_percentile: 100.0    # Percentage of features to keep (e.g. 10.0 for top 10%); 100.0 = keep all
    pca:
      enabled: false
      n_components: 0.95
      whiten: false
      svd_solver: "auto"
      random_state: null

  classification:
    model: "svm"                         # "svm" | "lr" | "rf" | "cnn"
    scoring: "average_precision"
    min_subjects_with_auc_for_inference: 2  # Require at least this many subjects with defined held-out AUC
    max_failed_fold_fraction: 0.25       # Abort classification if failed folds exceed this fraction of total folds
    calibrate_ensemble: false            # Calibrate SVM/RF probability outputs using CalibratedClassifierCV
    resampler: "none"                    # "none" | "undersample" | "smote"
    resampler_seed: 42                   # Random seed for resampling

  interpretability:
    grouped_outputs: true                # Write band/ROI grouped importance tables when available

  fmri_signature:
    method: "beta-series"
    contrast_name: "contrast"
    signature_name: "auto"
    metric: "dot"
    normalization: "none"
    round_decimals: 3

  plotting:
    enabled: true
    formats: ["png"]
    dpi: 300
    top_n_features: 20
    include_diagnostics: true

  analysis:
    riemann:
      min_channels_for_fold: 4
    permutation_importance:
      enabled: false
      n_repeats: 5
      min_valid_fold_fraction: 0.8
    shap:
      enabled: true
      min_valid_fold_fraction: 0.8
    uncertainty:
      alpha: 0.1                        # Significance level for conformal prediction intervals (0.1 = 90% coverage)
      min_valid_fold_fraction: 0.8
    time_generalization:
      min_subjects_per_cell: 2           # Require at least this many held-out subjects with finite cell scores
      min_valid_permutation_fraction: 0.8  # Minimum valid permutations required for TG inferential outputs
      min_valid_fold_fraction: 0.8
      active_window: *active_window
      window_len: 0.75
      step: 0.25
      use_ridgecv: false
      alpha_grid: [0.01, 0.1, 1.0, 10.0, 100.0]
      default_alpha: 1.0
      cluster_threshold: 0.05
      min_count_per_cell: 15
      min_samples_for_corr: 10
      min_samples_per_window: 15
  models:
    regression_default: "elasticnet"    # Default regression model: "elasticnet" | "ridge" | "rf"
    elasticnet:
      alpha_grid: [0.001, 0.01, 0.1, 1, 10]
      l1_ratio_grid: [0.2, 0.5, 0.8]
      max_iter: 10000
      tol: 1.0e-4
      selection: "cyclic"           # "cyclic" or "random"
    ridge:
      alpha_grid: [0.01, 0.1, 1.0, 10.0, 100.0]
    random_forest:
      n_estimators: 500
      max_depth_grid: [5, 10, 20, null]
      min_samples_split_grid: [2, 5, 10]
      min_samples_leaf_grid: [1, 2, 4]
      bootstrap: true
      class_weight: "balanced"
    svm:
      kernel: "rbf"
      C_grid: [0.1, 1.0, 10.0]
      gamma_grid: ["scale", "auto"]
      class_weight: "balanced"
    logistic_regression:
      penalty: "l2"
      C_grid: [0.01, 0.1, 1.0, 10.0]
      l1_ratio_grid: [0.1, 0.5, 0.9]  # used when penalty="elasticnet"
      max_iter: 1000
      class_weight: "balanced"
    cnn:
      temporal_filters: 8
      depth_multiplier: 2
      pointwise_filters: 16
      kernel_length: 64
      separable_kernel_length: 16
      dropout: 0.5
      batch_size: 64
      max_epochs: 75
      patience: 10
      learning_rate: 0.001
      weight_decay: 0.001
      val_fraction: 0.2
      gradient_clip_norm: 1.0
      standardization_std_floor: 1.0e-6
      use_cuda: false

###################################################################
# 5. STATISTICS & VALIDATION
###################################################################
statistics:
  alpha: &default_alpha 0.05
  sig_alpha: *default_alpha
  fdr_alpha: *default_alpha
  ci_level: 0.95
  n_permutations: 1000
  n_bootstrap: 1000
  cluster_n_jobs: -1
  cluster_n_perm: 1000
  
  constants:
    fisher_z_clip_min: -0.999999
    fisher_z_clip_max: 0.999999
    min_samples_for_correlation: 5
    min_samples_per_covariate: 5
    partial_corr_base_samples: 5
    min_dof_for_correlation: 2
    log_base: *log_base
    percentage_multiplier: *percentage_multiplier
    # Neighbours per channel for the distance-based sensor adjacency used when MNE's
    # Delaunay adjacency fails. Cluster-based permutation inference is sensitive to
    # adjacency density, so this approximates what it replaces: symmetrized 5-nearest
    # -neighbour adjacency has a mean degree of 5.78 against Delaunay's 5.43 on
    # easycap-M1, the closest match among k = 3-6.
    k_neighbors_adjacency: 5

validation:
  min_epochs: 20
  min_channels: 10
  max_amplitude_uv: 500

io:
  constants:
    percent_threshold: 5.0
