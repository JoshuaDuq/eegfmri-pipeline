# EEG recorded outside an MR scanner. The starting point for both paradigms.
#
# Use as:
#
#     # my_study.yaml
#     extends: "eeg_only"
#     project:
#       task: "oddball"
#     paths:
#       bids_root: "/data/my_study/bids"
#       deriv_root: "/data/my_study/derivatives"
#
#     eeg-pipeline --config my_study.yaml preprocessing full --all-subjects
#
# RESTING-STATE OR BASELINE-ONLY: add the second knob.
#
#     extends: "eeg_only"
#     project:
#       paradigm: "rest"
#       task: "rest"
#
# project.paradigm is 'task' here. Setting it to 'rest' cuts the recording into
# fixed-length segments instead of epoching around events, and removes the inherited
# settings that depend on an event having happened — the event-locked feature families
# (erp, erds, itpc), and the baseline-relative component TFR and its condition
# contrasts. Nothing else has to be restated. project.task is still required: rest
# epochs are written and found under the BIDS task label like any other.
#
# The 'rest' preset is for resting-state recorded *inside* a scanner, which is a
# different thing — it keeps the gradient/pulse correction and volume-marker handling.
#
# Everything not named below is inherited from the packaged eeg_config.yaml, so
# corrections to the scientific defaults reach this preset without being copied.
#
# WHAT THIS PRESET DOES NOT DECIDE FOR YOU
# ----------------------------------------
# The inherited defaults were chosen for a 22-second thermal-stimulation paradigm. They
# are not wrong so much as specific, and no preset can guess the right values, so review
# these before trusting any output:
#
#   epochs.tmin / epochs.tmax        -7.0 / 15.0 s — very long, for a slow thermal response
#   epochs.baseline                  [-0.2, 0.0]
#   time_windows.active              [3.0, 10.5] s — when the stimulus is "on"
#   eeg.montage                      easycap-M1
#   eeg.eog_channels                 Fp1/Fp2 surrogates; name a real EOG lead if you have one
#   preprocessing.resample_freq      500 Hz
#   preprocessing.notch_freq         60 Hz — set 50 outside North America
#   rois                             easycap-M1 10-20 names, and the Left/Right labels are
#                                    valid only for consistent left-side stimulation. They
#                                    drive the report's region-coverage table, so a
#                                    different montage gets regions with no channels in them
#
# The subject report assumes things about your paradigm too, and each is one line:
#
#   report.analysis.response_window_s        [0.0, 1.0] s — where the split-half evoked
#                                            reliability is measured. A paradigm whose
#                                            response falls outside it reports a
#                                            reliability near zero for a sound dataset
#   report.analysis.alpha_band_hz            [7.0, 14.0] — the rhythm used as preservation
#   report.analysis.alpha_reference_band_hz  [3.0, 25.0] — must surround the band above
#   report.acquisition.posterior_channel_pattern
#                                            10-20 names; a different naming scheme leaves
#                                            the preservation panel with no channels
#   report.acquisition.non_event_prefixes    annotation prefixes that are not trials. Add
#                                            what your acquisition writes for itself; never
#                                            add a prefix your own trials start with
#   report.thresholds.plausible_heart_rate_bpm
#                                            [30, 220] — an adult range
#
# 'eeg-pipeline validate --config-only' reports whatever is still contradictory.

extends: "../eeg_config.yaml"

paths:
  # Line-comb removal is part of the scanner chain: the manifest records which bands a
  # decomb stage took out of a gradient-corrected recording, and the report reads it to
  # avoid scoring filtered bins as surviving artifact. Out of a scanner there was no comb
  # to remove and there is no manifest.
  #
  # Inherited, the packaged path resolves to the line-notch manifest of the study this
  # repository was developed on, and building the report raised FileNotFoundError on a
  # file the new user has never heard of. Nulled here rather than made tolerant in the
  # reader: a study that does opt in and mistypes the path must still hear about it,
  # because a silently missing mask makes the comb section report the filter as residual.
  decomb_manifest: null

project:
  paradigm: "task"
  # Deliberately unset: the BIDS task label selects which recordings are read, and
  # inheriting another study's would quietly process nothing. validate --config-only
  # names this key until you set it.
  task: null

preprocessing:
  # The declaration every scanner-only stage is gated on.
  eeg_fmri: false
  brainvision_analyzer:
    # No Analyzer gradient/pulse correction precedes an out-of-scanner recording.
    enabled: false
  clean_events_qc:
    ecg_coupling:
      # Off because no ECG channel is named below, not because there is no scanner.
      enabled: false

alignment:
  # No scanner volume markers to trim to.
  trim_to_volume_bounds: false

# ---------------------------------------------------------------------------
# DO YOU HAVE AN ECG LEAD? A separate question from whether you were in a scanner.
# ---------------------------------------------------------------------------
# Assumed no here, because a montage without one is the common out-of-scanner case and
# naming a channel that does not exist fails at the recording rather than in the config.
#
# If you do record ECG outside the scanner — which is ordinary, and useful — name it and
# switch the two stages back on. Neither depends on there being a scanner:
#
#     eeg:
#       ecg_channels: ["ECG"]        # exactly as the channel is named in channels.tsv
#     ica:
#       cardiac_review:
#         enabled: true              # detects R peaks in the lead; reviews ICA components
#     preprocessing:
#       clean_events_qc:
#         ecg_coupling:
#           enabled: true            # correlates EEG against the lead
#
# The cardiac review prefers BrainVision Analyzer's R markers where a recording carries
# them and otherwise detects R peaks from the channel directly, so outside a scanner it
# reviews ordinary cardiac artifact rather than a ballistocardiogram. ICLabel labels
# cardiac components either way, and the ocular review is unaffected by all of this.
eeg:
  ecg_channels: []

ica:
  cardiac_review:
    # Off because no ECG channel is named above, not because there is no scanner.
    enabled: false
  band_specific_report:
    # The inherited comparison is on stimulus_temp, a column of the thermal study.
    # Add your own condition contrasts here, or leave empty.
    comparisons: []
