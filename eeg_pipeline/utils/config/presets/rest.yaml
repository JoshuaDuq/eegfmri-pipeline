# Resting-state acquisition: no events to epoch around.
#
# This preset says "no events", nothing more. The scanner declaration it used to inherit
# no longer exists — the packaged eeg_config.yaml describes EEG alone, and anything a
# scanner adds is configured by the study that has one.
#
# Use this preset as:
#
#     # my_baseline.yaml
#     extends: "rest"
#     project:
#       task: "rest"
#     paths:
#       bids_root: "/data/my_study/bids"
#       deriv_root: "/data/my_study/derivatives"
#
#     eeg-pipeline --config my_baseline.yaml preprocessing full --all-subjects
#
# WHAT CHANGES IN REST MODE
# -------------------------
# The recording is cut into fixed-length segments instead of being epoched around events.
# There is no event, so there is no pre-stimulus interval and no baseline; anything
# defined relative to a stimulus is unavailable rather than merely unset. Clean-events
# export is skipped, and the subject report measures preservation on the posterior alpha
# rhythm rather than on split-half evoked reliability.
#
# project.paradigm removes the inherited settings that depend on an event — the
# event-locked feature families, and the baseline-relative component TFR and its
# condition contrasts — so they are not restated here. A family this study *names* is
# left alone and reported against the paradigm instead.
#
# paths.bids_rest_root and paths.deriv_rest_root are only needed by a study that acquires
# *both* task and rest and keeps them in separate trees. A rest-only study leaves them
# null and uses paths.bids_root / paths.deriv_root like any other.

extends: "../eeg_config.yaml"

project:
  # Sets preprocessing.task_is_rest, feature_engineering.task_is_rest and both fMRI
  # equivalents together, so they cannot disagree.
  paradigm: "rest"
  # Deliberately unset: rest epochs are still written and found under the BIDS task
  # label, so inheriting another study's selected recordings that are not there.
  # validate --config-only names this key until you set it.
  task: null

preprocessing:
  # Length of each fixed-length segment. 10 s is a common choice for spectral estimates;
  # longer segments buy frequency resolution at the cost of segment count.
  rest_epochs_duration: 10.0
  # Overlap is not supported: overlapping segments would be carried downstream as
  # independent trial rows.
  rest_epochs_overlap: 0.0
