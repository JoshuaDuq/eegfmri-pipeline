name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check eeg_pipeline fmri_pipeline tests scripts

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify CLI/TUI config coverage
        run: |
          python eeg_pipeline/utils/config/introspect.py --repo-root . --strict

      - name: Run tests
        run: |
          python -m compileall -q eeg_pipeline fmri_pipeline scripts tests
          python -m pytest -q --cov=eeg_pipeline/pipelines --cov=fmri_pipeline/pipelines --cov-report=term-missing --cov-fail-under=75

  windows-compat:
    needs: lint
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify CLI/TUI config coverage
        run: |
          python eeg_pipeline/utils/config/introspect.py --repo-root . --strict

      - name: Run targeted Windows compatibility tests
        run: |
          python -m pytest -q --no-cov tests/utils/test_tui_config_gap_audit.py tests/scripts/test_tui_pipeline_smoke_script.py tests/pipelines/test_fmri_preprocessing_helpers.py tests/pipelines/test_bem_generation_strict_failures.py

      - name: Run TUI tests
        working-directory: eeg_pipeline/cli/tui
        run: |
          go test ./...
          go build -o eeg-tui.exe .

      - name: Run lightweight CLI smoke checks
        run: |
          python scripts/tui_pipeline_smoke.py --pipelines validate,info,runtime_version --timeout-s 20
